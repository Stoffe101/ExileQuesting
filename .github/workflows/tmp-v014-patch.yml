name: Temporary v0.1.4 patch runner

on:
  push:
    branches:
      - codex/v0.1.4-lab-updater-hotfix
    paths:
      - '.github/workflows/tmp-v014-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0.1.4-lab-updater-hotfix
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply deterministic source patches
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # React Lab now uses the same renderer/preload path as the manager.
          replace_once('src/ui/App.tsx', "} from './reliability';\n", "} from './reliability';\nimport PreplaytestLab from './PreplaytestLab';\n")
          replace_once('src/ui/App.tsx', "  return mode === 'overlay' ? <Overlay state={state} /> : <Manager state={state} setState={setState} />;\n", "  if (mode === 'overlay') return <Overlay state={state} />;\n  if (mode === 'lab') return <PreplaytestLab state={state} setState={setState} />;\n  return <Manager state={state} setState={setState} />;\n")

          # Main process: correct release feed, Lab renderer, simulator IPC, and Lab smoke mode.
          replace_once('electron/main.ts', "import { appendHistory, decideProgression, makeHistoryEntry, reconcileStartup } from '../src/core/progression';\n", "import { appendHistory, decideProgression, makeHistoryEntry, reconcileStartup } from '../src/core/progression';\nimport { simulateCanonicalCampaign } from '../src/core/simulator';\n")
          replace_once('electron/main.ts', "const APP_RELEASE_REPOSITORY = 'Stoffe101/ExileQuesting-Releases';", "const APP_RELEASE_REPOSITORY = 'Stoffe101/ExileQuesting';")
          replace_once('electron/main.ts', "const overlaySoakArgument = process.argv.find((argument) => argument.startsWith('--overlay-soak='));\n", "const overlaySoakArgument = process.argv.find((argument) => argument.startsWith('--overlay-soak='));\nconst isLabSmokeTest = process.argv.includes('--lab-smoke');\n")
          replace_once('electron/main.ts', "let lastReplay: ReplayUiResult | null = null;\n", "let lastReplay: ReplayUiResult | null = null;\nlet lastSimulation: Array<{ name: string; report: ReturnType<typeof simulateCanonicalCampaign> }> | null = null;\n")
          replace_once('electron/main.ts', "async function loadRenderer(window: BrowserWindow, mode: 'manager' | 'overlay'): Promise<void> {", "async function loadRenderer(window: BrowserWindow, mode: 'manager' | 'overlay' | 'lab'): Promise<void> {")
          replace_once('electron/main.ts', "  labWindow = createPreplaytestLab(path.join(__dirname, 'preload.cjs'));\n  wireWindowDiagnostics(labWindow, 'Pre-playtest Lab');\n  labWindow.on('closed', () => { labWindow = null; overlayDemo = null; broadcastState(); });\n", "  labWindow = createPreplaytestLab(path.join(__dirname, 'preload.cjs'), !app.isPackaged);\n  wireWindowDiagnostics(labWindow, 'Pre-playtest Lab');\n  void loadRenderer(labWindow, 'lab').catch((error) => log.error('Failed to load Pre-playtest Lab UI.', error));\n  labWindow.on('closed', () => { labWindow = null; overlayDemo = null; broadcastState(); });\n")

          simulation_block = r'''const SIMULATION_SCENARIOS = [
  { name: 'League start · all optional · kill all bandits', options: { leagueStart: true, showOptional: true, bandit: 'none' as const } },
  { name: 'League start · optional hidden', options: { leagueStart: true, showOptional: false, bandit: 'none' as const } },
  { name: 'Twink/non-league-start · all optional', options: { leagueStart: false, showOptional: true, bandit: 'none' as const } },
  { name: 'Bandit · Alira', options: { leagueStart: true, showOptional: true, bandit: 'alira' as const } },
  { name: 'Bandit · Kraityn', options: { leagueStart: true, showOptional: true, bandit: 'kraityn' as const } },
  { name: 'Bandit · Oak', options: { leagueStart: true, showOptional: true, bandit: 'oak' as const } },
];
function runCampaignSimulation() {
  lastSimulation = SIMULATION_SCENARIOS.map((scenario) => ({ ...scenario, report: simulateCanonicalCampaign(dataset, scenario.options) }));
  return lastSimulation;
}
async function exportCampaignSimulation(): Promise<boolean> {
  if (!lastSimulation) return false;
  const options: Electron.SaveDialogOptions = {
    title: 'Export ExileQuesting campaign simulation',
    defaultPath: `ExileQuesting-campaign-simulation-${new Date().toISOString().replace(/[:.]/g, '-')}.json`,
    filters: [{ name: 'ExileQuesting simulation', extensions: ['json'] }],
  };
  const owner = labWindow && !labWindow.isDestroyed() ? labWindow : mainWindow;
  const result = owner ? await dialog.showSaveDialog(owner, options) : await dialog.showSaveDialog(options);
  if (result.canceled || !result.filePath) return false;
  await fs.writeFile(result.filePath, JSON.stringify({ schemaVersion: 1, generatedAt: new Date().toISOString(), appVersion: app.getVersion(), campaign: dataset.source, scenarios: lastSimulation }, null, 2), 'utf8');
  return true;
}

'''
          replace_once('electron/main.ts', "function sanitizeDemo(value: unknown): OverlayDemoConfig {\n", simulation_block + "function sanitizeDemo(value: unknown): OverlayDemoConfig {\n")
          replace_once('electron/main.ts', "  ipcMain.handle('overlay:demo-stop', () => { overlayDemo = null; broadcastState(); return runtimeState(); });\n", "  ipcMain.handle('overlay:demo-stop', () => { overlayDemo = null; broadcastState(); return runtimeState(); });\n  ipcMain.handle('simulation:run', () => runCampaignSimulation());\n  ipcMain.handle('simulation:export', async () => exportCampaignSimulation());\n")

          lab_smoke = r'''    if (isLabSmokeTest) {
      overlayWindow = createOverlayWindow();
      labWindow = createPreplaytestLab(path.join(__dirname, 'preload.cjs'), false);
      wireWindowDiagnostics(labWindow, 'Pre-playtest Lab smoke');
      await loadRenderer(labWindow, 'lab');
      await waitForRenderer(labWindow);
      await new Promise((resolve) => setTimeout(resolve, 700));
      const smoke = await labWindow.webContents.executeJavaScript(`(async () => {
        const api = window.exileQuesting;
        const domReady = Boolean(document.querySelector('[data-testid="lab-ready"]'));
        if (!api || typeof api.previewOverlay !== 'function' || typeof api.runCampaignSimulation !== 'function') return { domReady, bridge: false };
        const preview = await api.previewOverlay({ progress: 0, mode: 'focus', characterLevel: 1, areaLevel: 1 });
        const scenarios = await api.runCampaignSimulation();
        return { domReady, bridge: true, previewProgress: preview.progress, scenarios: scenarios.length, passed: scenarios.every((item) => item.report.passed) };
      })()`, true) as { domReady: boolean; bridge: boolean; previewProgress?: number; scenarios?: number; passed?: boolean };
      if (!smoke.domReady || !smoke.bridge || smoke.previewProgress !== 0 || smoke.scenarios !== 6 || !smoke.passed) throw new Error(`Pre-playtest Lab smoke failed: ${JSON.stringify(smoke)}`);
      log.info('Pre-playtest Lab smoke passed.', smoke);
      app.exit(0);
      return;
    }

'''
          replace_once('electron/main.ts', "    if (visualSmokeArgument || overlaySoakArgument) {\n", lab_smoke + "    if (visualSmokeArgument || overlaySoakArgument) {\n")

          # Replace fragile cmd.exe updater handoff with a hidden PowerShell wait/install/relaunch helper.
          old_install = r'''  async installOnExit(): Promise<boolean> {
    if (!this.downloadedPath || this.state.status !== 'ready') return false;
    try {
      await fs.access(this.downloadedPath);
      const commandProcessor = process.env.ComSpec || 'cmd.exe';
      const quotedInstaller = `"${this.downloadedPath.replace(/"/g, '""')}"`;
      const command = `timeout /t 2 /nobreak >nul & start "" ${quotedInstaller} /S`;
      const child = spawn(commandProcessor, ['/d', '/s', '/c', command], {
        detached: true,
        windowsHide: true,
        stdio: 'ignore',
      });
      child.unref();
      this.options.log?.info(`Scheduled update installer after exit: ${this.downloadedPath}`);
      return true;
    } catch (error) {
      const message = error instanceof Error ? error.message : String(error);
      this.options.log?.warn('Failed to schedule application update installation.', error);
      this.setState({ status: 'error', error: message, message: `Could not start the update installer. ${message}` });
      return false;
    }
  }
'''
          new_install = r'''  async installOnExit(): Promise<boolean> {
    if (!this.downloadedPath || this.state.status !== 'ready') return false;
    try {
      await fs.access(this.downloadedPath);
      const launcherPath = path.join(this.options.updatesDirectory, 'apply-update.ps1');
      const resultPath = path.join(this.options.updatesDirectory, 'last-update-result.json');
      const launcher = `param(
  [Parameter(Mandatory=$true)][int]$ParentPid,
  [Parameter(Mandatory=$true)][string]$Installer,
  [Parameter(Mandatory=$true)][string]$AppExe,
  [Parameter(Mandatory=$true)][string]$ResultFile
)
$ErrorActionPreference = 'Stop'
$result = [ordered]@{ status = 'starting'; installer = $Installer; appExe = $AppExe; exitCode = $null; relaunched = $false; error = $null; completedAt = $null }
try {
  try { Wait-Process -Id $ParentPid -ErrorAction Stop } catch { }
  Start-Sleep -Milliseconds 750
  if (-not (Test-Path -LiteralPath $Installer)) { throw "Downloaded installer no longer exists: $Installer" }
  $install = Start-Process -FilePath $Installer -ArgumentList '/S' -Wait -PassThru -WindowStyle Hidden
  $result.exitCode = $install.ExitCode
  if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)." }
  $result.status = 'installed'
  Start-Sleep -Milliseconds 500
  if (Test-Path -LiteralPath $AppExe) {
    Start-Process -FilePath $AppExe -WorkingDirectory (Split-Path -Parent $AppExe) | Out-Null
    $result.relaunched = $true
  } else {
    throw "Installed application executable was not found after update: $AppExe"
  }
} catch {
  $result.status = 'failed'
  $result.error = $_.Exception.Message
} finally {
  $result.completedAt = (Get-Date).ToString('o')
  $result | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $ResultFile -Encoding UTF8
}
`;
      await fs.writeFile(launcherPath, launcher, 'utf8');
      const child = spawn('powershell.exe', [
        '-NoLogo', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-WindowStyle', 'Hidden',
        '-File', launcherPath,
        '-ParentPid', String(process.pid),
        '-Installer', this.downloadedPath,
        '-AppExe', process.execPath,
        '-ResultFile', resultPath,
      ], { detached: true, windowsHide: true, stdio: 'ignore' });
      await new Promise<void>((resolve, reject) => {
        child.once('spawn', resolve);
        child.once('error', reject);
      });
      child.unref();
      this.options.log?.info(`Scheduled verified update installer after exit: ${this.downloadedPath}`);
      return true;
    } catch (error) {
      const message = error instanceof Error ? error.message : String(error);
      this.options.log?.warn('Failed to schedule application update installation.', error);
      this.setState({ status: 'error', error: message, message: `Could not start the update installer. ${message}` });
      return false;
    }
  }
'''
          replace_once('electron/services/app-updater.ts', old_install, new_install)

          # Version and scripts.
          package = Path('package.json').read_text(encoding='utf-8')
          package = package.replace('"version": "0.1.3"', '"version": "0.1.4"', 1)
          package = package.replace('"soak:overlay": "npm run build && electron . --overlay-soak=artifacts/soak",', '"soak:overlay": "npm run build && electron . --overlay-soak=artifacts/soak",\n    "smoke:lab": "npm run build && electron . --lab-smoke",', 1)
          Path('package.json').write_text(package, encoding='utf-8')

          # Windows CI and release CI must exercise the Lab bridge/IPC before packaging.
          replace_once('.github/workflows/windows-package.yml', "      - run: npm run simulate:campaign\n", "      - run: npm run simulate:campaign\n      - name: Smoke test Pre-playtest Lab\n        run: npm run smoke:lab\n")
          replace_once('.github/workflows/release.yml', "      - run: npm run simulate:campaign\n", "      - run: npm run simulate:campaign\n      - name: Smoke test Pre-playtest Lab\n        run: npm run smoke:lab\n")
      - name: Synchronize package-lock version
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add electron/main.ts electron/services/app-updater.ts src/ui/App.tsx package.json package-lock.json .github/workflows/windows-package.yml .github/workflows/release.yml
          git commit -m 'Wire v0.1.4 Lab and updater hotfix'
          git push origin HEAD:codex/v0.1.4-lab-updater-hotfix
