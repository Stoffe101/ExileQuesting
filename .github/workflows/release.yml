name: Release Windows installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - package.json

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve release version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $releaseTag = "v$($package.version)"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne $releaseTag) {
            throw "Tag ${{ github.ref_name }} does not match package.json version $($package.version)."
          }
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Release candidate: $releaseTag"
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:gems
      - run: npm run validate:passives
      - run: npm run audit:campaign
      - run: npm run lint:campaign
      - run: npm run simulate:campaign
      - name: Smoke test Pre-playtest Lab controls
        run: npm run smoke:lab
      - name: Render release manager responsive matrix
        run: npm run visual:manager
      - name: Render release Gear Coach visual smoke
        run: npm run visual:gear
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ExileQuesting-release-manager-visuals-${{ github.sha }}
          path: artifacts/manager-visual/**/*
          if-no-files-found: warn
          retention-days: 30
      - name: Render release overlay visual matrix
        run: npm run visual:overlay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ExileQuesting-release-overlay-visuals-${{ github.sha }}
          path: artifacts/visual/**/*
          if-no-files-found: warn
          retention-days: 30
      - name: Render release Passive Tree HUD visual matrix
        run: npm run visual:passive-hud
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ExileQuesting-release-passive-tree-hud-visuals-${{ github.sha }}
          path: artifacts/passive-tree-hud/**/*
          if-no-files-found: warn
          retention-days: 30
      - name: Soak release overlay lifecycle
        run: npm run soak:overlay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ExileQuesting-release-overlay-soak-${{ github.sha }}
          path: artifacts/soak/**/*
          if-no-files-found: warn
          retention-days: 30
      - run: npm run dist
      - name: Smoke test real previous-to-release updater handoff
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $candidateVersion = [string]$package.version
          $candidateTag = "v$candidateVersion"
          $setup = @(Get-ChildItem release -Filter 'ExileQuesting-*-setup.exe')
          if ($setup.Count -ne 1) { throw "Expected exactly one NSIS setup executable, found $($setup.Count)." }

          $releases = gh release list --repo "${{ github.repository }}" --limit 20 --json tagName,isDraft,isPrerelease,publishedAt | ConvertFrom-Json
          $previous = $releases | Where-Object { -not $_.isDraft -and -not $_.isPrerelease -and $_.tagName -ne $candidateTag } | Sort-Object publishedAt -Descending | Select-Object -First 1
          if (-not $previous) { throw "Could not find a previous stable release to exercise the release updater against $candidateTag." }

          $previousDir = Join-Path $env:RUNNER_TEMP "ExileQuestingReleasePrevious"
          New-Item -ItemType Directory -Path $previousDir -Force | Out-Null
          gh release download $previous.tagName --repo "${{ github.repository }}" --pattern 'ExileQuesting-*-setup.exe' --dir $previousDir
          if ($LASTEXITCODE -ne 0) { throw "Could not download previous release $($previous.tagName)." }
          $previousSetups = @(Get-ChildItem $previousDir -Filter 'ExileQuesting-*-setup.exe')
          if ($previousSetups.Count -ne 1) { throw "Expected one previous setup executable, found $($previousSetups.Count)." }

          $installDir = Join-Path $env:RUNNER_TEMP "ExileQuestingReleaseUpdateSmoke"
          $install = Start-Process -FilePath $previousSetups[0].FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Previous release install failed with exit code $($install.ExitCode)." }
          $installedExe = Join-Path $installDir "ExileQuesting.exe"
          if (-not (Test-Path $installedExe)) { throw "Previous release did not install ExileQuesting.exe." }
          $previousRun = Start-Process -FilePath $installedExe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($previousRun.ExitCode -ne 0) { throw "Previous installed release smoke test failed with exit code $($previousRun.ExitCode)." }

          npm run smoke:update-handoff
          if ($LASTEXITCODE -ne 0) { throw 'Updater handoff smoke harness failed to build.' }
          $handoffDir = Join-Path $env:RUNNER_TEMP "ExileQuestingReleaseUpdateHandoff"
          node .tmp/smoke-update-handoff.cjs $setup[0].FullName $handoffDir $installedExe
          if ($LASTEXITCODE -ne 0) { throw 'Updater handoff smoke harness failed to schedule the release update.' }

          $resultFile = Join-Path $handoffDir 'last-update-result.json'
          $traceFile = Join-Path $handoffDir 'last-update-trace.log'
          for ($attempt = 0; $attempt -lt 180 -and -not (Test-Path $resultFile); $attempt++) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path $resultFile)) {
            if (Test-Path $traceFile) { Write-Host '--- updater trace ---'; Get-Content $traceFile }
            throw 'Release updater handoff did not produce a result within 90 seconds.'
          }
          $handoff = Get-Content $resultFile -Raw | ConvertFrom-Json
          if (Test-Path $traceFile) { Write-Host '--- updater trace ---'; Get-Content $traceFile }
          if ($handoff.status -ne 'installed' -or $handoff.exitCode -ne 0 -or -not $handoff.relaunched) {
            throw "Release updater handoff failed: $($handoff | ConvertTo-Json -Compress)"
          }
          if (-not (Test-Path $installedExe)) { throw 'Release updater handoff removed the installed executable.' }

          Start-Sleep -Seconds 2
          $relaunched = @(Get-Process ExileQuesting -ErrorAction SilentlyContinue)
          if ($relaunched.Count -lt 1) { throw 'Release updater reported a relaunch, but no ExileQuesting process was running after the update.' }
          Write-Host "Verified release updater relaunch process: $($relaunched[0].Id)."
          $relaunched | Stop-Process -Force
          Start-Sleep -Milliseconds 750
          $updatedRun = Start-Process -FilePath $installedExe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($updatedRun.ExitCode -ne 0) { throw "Updated release smoke test failed with exit code $($updatedRun.ExitCode)." }
          $productVersion = (Get-Item $installedExe).VersionInfo.ProductVersion
          if ($productVersion -notlike "$candidateVersion*") { throw "Updater left product version '$productVersion'; expected $candidateVersion." }
          Write-Host "Verified release update path: $($previous.tagName) -> $candidateTag ($productVersion)."

          $uninstaller = Join-Path $installDir "Uninstall ExileQuesting.exe"
          if (Test-Path $uninstaller) {
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "Release uninstall failed with exit code $($uninstall.ExitCode)." }
          }
      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $setup = Get-Item release/ExileQuesting-*-setup.exe
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToLower()
          "$hash  $($setup.Name)" | Set-Content -Encoding ascii "release/$($setup.Name).sha256"
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:RELEASE_TAG already exists; verified build complete, publication skipped."
            exit 0
          }
          $setup = Get-Item release/ExileQuesting-*-setup.exe
          $checksum = Get-Item "release/$($setup.Name).sha256"
          $notes = (Get-Content RELEASE_NOTES.md -Raw).TrimEnd()
          $notes += "`r`n`r`nWindows installer published from the verified ExileQuesting release pipeline.`r`nSource build: ${{ github.sha }}"
          gh release create $env:RELEASE_TAG $setup.FullName $checksum.FullName --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "ExileQuesting $env:RELEASE_TAG" --notes $notes
