name: Release Windows installer

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          if ($tagVersion -ne $package.version) {
            throw "Tag version $tagVersion does not match package.json version $($package.version)."
          }
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:campaign
      - run: npm run lint:campaign
      - run: npm run simulate:campaign
      - name: Render release manager responsive matrix
        run: npm run visual:manager
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ExileQuesting-release-manager-visuals-${{ github.sha }}
          path: artifacts/manager-visual/**/*
          if-no-files-found: warn
          retention-days: 30
      - name: Render release overlay visual matrix
        run: npm run visual:overlay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ExileQuesting-release-overlay-visuals-${{ github.sha }}
          path: artifacts/visual/**/*
          if-no-files-found: warn
          retention-days: 30
      - name: Soak release overlay lifecycle
        run: npm run soak:overlay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ExileQuesting-release-overlay-soak-${{ github.sha }}
          path: artifacts/soak/**/*
          if-no-files-found: warn
          retention-days: 30
      - run: npm run dist
      - name: Smoke test installed release
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem release -Filter 'ExileQuesting-*-setup.exe')
          if ($setup.Count -ne 1) { throw "Expected exactly one NSIS setup executable, found $($setup.Count)." }
          $installDir = Join-Path $env:RUNNER_TEMP "ExileQuestingReleaseSmoke"
          $install = Start-Process -FilePath $setup[0].FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer failed with exit code $($install.ExitCode)." }
          $installedExe = Join-Path $installDir "ExileQuesting.exe"
          if (-not (Test-Path $installedExe)) { throw "Release installer did not install ExileQuesting.exe." }
          $run = Start-Process -FilePath $installedExe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "Installed release smoke test failed with exit code $($run.ExitCode)." }
          $uninstaller = Join-Path $installDir "Uninstall ExileQuesting.exe"
          if (Test-Path $uninstaller) {
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "Release uninstall failed with exit code $($uninstall.ExitCode)." }
          }
      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $setup = Get-Item release/ExileQuesting-*-setup.exe
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToLower()
          "$hash  $($setup.Name)" | Set-Content -Encoding ascii "release/$($setup.Name).sha256"
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-Item release/ExileQuesting-*-setup.exe
          $checksum = Get-Item "release/$($setup.Name).sha256"
          $notes = @"
          ExileQuesting ${{ github.ref_name }}

          Windows installer published from the verified ExileQuesting release pipeline.
          Source build: ${{ github.sha }}
          "@
          gh release create "${{ github.ref_name }}" $setup.FullName $checksum.FullName --repo "${{ github.repository }}" --title "ExileQuesting ${{ github.ref_name }}" --notes $notes
