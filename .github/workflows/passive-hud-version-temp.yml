name: Passive HUD version prep temp

on:
  push:
    branches:
      - feature/passive-tree-hud
    paths:
      - .github/workflows/passive-hud-version-temp.yml

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/passive-tree-hud
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set v0.2.1 package metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const file of ['package.json', 'package-lock.json']) {
            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            json.version = '0.2.1';
            if (file === 'package-lock.json') {
              if (!json.packages?.['']) throw new Error('package-lock root package is missing');
              json.packages[''].version = '0.2.1';
            }
            fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
          }
          NODE
      - name: Verify version metadata
        run: |
          node -e "const p=require('./package.json'),l=require('./package-lock.json'); if(p.version!=='0.2.1'||l.version!=='0.2.1'||l.packages[''].version!=='0.2.1') process.exit(1)"
      - name: Remove version helper and commit
        shell: bash
        run: |
          git rm .github/workflows/passive-hud-version-temp.yml
          git config user.name "Skrra"
          git config user.email "94893570+Stoffe101@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m "Prepare Passive Tree HUD v0.2.1"
          git push origin HEAD:feature/passive-tree-hud
