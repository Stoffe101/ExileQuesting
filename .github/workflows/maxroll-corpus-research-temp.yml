name: Build-guide corpus research temporary

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Inspect current Maxroll leveling corpus
        run: npx esbuild tools/research-maxroll-corpus-temp.ts --bundle --platform=node --format=esm --outfile=.tmp/research-maxroll-corpus-temp.mjs && node .tmp/research-maxroll-corpus-temp.mjs
      - name: Upload Maxroll corpus report
        uses: actions/upload-artifact@v4
        with:
          name: maxroll-corpus-report
          path: maxroll-corpus-report.json
          if-no-files-found: error
      - name: Inspect current Mobalytics build structure
        continue-on-error: true
        run: node tools/research-mobalytics-temp.mjs
      - name: Upload Mobalytics structure report when available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobalytics-structure-report
          path: mobalytics-structure-report.json
          if-no-files-found: ignore
      - name: Exercise permanent companion upstream monitor
        run: npx esbuild tools/check-companion-upstreams.ts --bundle --platform=node --format=esm --outfile=.tmp/check-companion-upstreams.mjs && node .tmp/check-companion-upstreams.mjs
