name: Build-guide corpus research temporary

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Inspect current Maxroll leveling corpus
        run: npx esbuild tools/research-maxroll-corpus-temp.ts --bundle --platform=node --format=esm --outfile=.tmp/research-maxroll-corpus-temp.mjs && node .tmp/research-maxroll-corpus-temp.mjs
      - name: Inspect current Mobalytics build structure
        run: node tools/research-mobalytics-temp.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: build-guide-corpus-reports
          path: |
            maxroll-corpus-report.json
            mobalytics-structure-report.json
          if-no-files-found: error
