name: v0.2.5 final visual manager type guard

on:
  push:
    branches: [feature/campaign-guide-2]
    paths:
      - .github/workflows/v025-final-visual-manager-typefix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/campaign-guide-2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply exact omitted type guard
        shell: pwsh
        run: |
          $path = 'tools/visual-manager.ts'
          $text = [IO.File]::ReadAllText($path)
          $old = 'if (!(bottomScrollTop > 0)) throw new Error(`${scenario.name}: page reports overflow but cannot actually scroll.`);'
          $new = 'if ((bottomScrollTop ?? 0) <= 0) throw new Error(`${scenario.name}: page reports overflow but cannot actually scroll.`);'
          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -ne 1) { throw "Expected exactly one old bottomScrollTop guard, found $count" }
          [IO.File]::WriteAllText($path, $text.Replace($old, $new))
      - run: npm ci
      - run: npm run typecheck
      - run: npm run visual:manager
      - name: Remove one-shot workflow
        shell: pwsh
        run: Remove-Item .github/workflows/v025-final-visual-manager-typefix.yml -Force
      - name: Commit validated final type guard
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/visual-manager.ts .github/workflows/v025-final-visual-manager-typefix.yml
          git commit -m "Fix manager visual strict type guard"
          git push origin HEAD:feature/campaign-guide-2
