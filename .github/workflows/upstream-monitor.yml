name: Exile-UI compatibility monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: upstream
        run: node tools/check-upstream.mjs
      - name: Generate bundled campaign audit
        run: node tools/audit-campaign.mjs
      - name: Open compatibility review issue
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.upstream.outputs.latest }}
          PINNED: ${{ steps.upstream.outputs.pinned }}
          VALID: ${{ steps.upstream.outputs.valid }}
          RELEVANT: ${{ steps.upstream.outputs.relevant }}
          ANNOTATIONS: ${{ steps.upstream.outputs.annotations }}
        shell: bash
        run: |
          existing=$(gh issue list --state open --search "Exile-UI compatibility review $LATEST in:title" --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh issue create \
              --title "Exile-UI compatibility review $LATEST" \
              --body "Exile-UI moved from \`$PINNED\` to \`$LATEST\`.\n\n- Structural validation: **$VALID**\n- Relevant changed files: **$RELEVANT**\n- Existing semantic annotations still matching: **$ANNOTATIONS**\n\nThe workflow summary contains an act-by-act semantic route diff. ExileQuesting will continue using its last verified snapshot unless staged runtime validation accepts the new files. Parsing successfully is not approval: review route meaning, structured actions, annotations, and compatibility paths before advancing the bundled fallback."
          fi
