name: Temporary Maxroll runtime patch

on:
  push:
    branches: [feature/maxroll-leveling-support]
    paths:
      - tools/patch-maxroll-gem-runtime-temp.mjs
      - .github/workflows/maxroll-runtime-patch-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/maxroll-leveling-support
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/patch-maxroll-gem-runtime-temp.mjs
      - name: Commit final patches
        run: |
          if git diff --quiet; then
            echo "No patches needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/main.ts docs/ROADMAP.md docs/POB_TO_PLAY.md
          git commit -m "Document Maxroll build planner support"
          git push
