name: Temporary Maxroll validation

on:
  push:
    branches: [codex/maxroll-leveling-support]
    paths:
      - tools/verify-maxroll-live-temp.ts
      - .github/workflows/maxroll-validate-temp.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:gems
      - run: npm run validate:passives
      - run: npm run audit:campaign
      - run: npm run lint:campaign
      - run: npm run simulate:campaign
      - run: npm run build
      - name: Verify live Maxroll guide contracts
        run: |
          npx esbuild tools/verify-maxroll-live-temp.ts --bundle --platform=node --format=esm --outfile=.tmp/verify-maxroll-live-temp.mjs
          node .tmp/verify-maxroll-live-temp.mjs
