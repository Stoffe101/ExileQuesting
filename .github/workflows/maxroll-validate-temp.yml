name: Temporary Maxroll validation

on:
  push:
    branches: [feature/maxroll-leveling-support]
    paths:
      - tools/verify-maxroll-live-temp.ts
      - .github/workflows/maxroll-validate-temp.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify live Maxroll guide contracts
        run: |
          npx esbuild tools/verify-maxroll-live-temp.ts --bundle --platform=node --format=esm --outfile=.tmp/verify-maxroll-live-temp.mjs
          node .tmp/verify-maxroll-live-temp.mjs
