name: Patch stale loot passthrough

on:
  push:
    branches: [codex/build-aware-campaign-intelligence]
    paths:
      - tools/patch-loot-passthrough.mjs
      - .github/workflows/loot-passthrough-patch-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/build-aware-campaign-intelligence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node tools/patch-loot-passthrough.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Commit patched runtime
        shell: bash
        run: |
          git add electron/main.ts
          if git diff --cached --quiet; then
            echo "Runtime patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Clear stale loot rules when no build is active"
          git push origin HEAD:codex/build-aware-campaign-intelligence
