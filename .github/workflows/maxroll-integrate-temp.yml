name: Temporary Maxroll integration

on:
  push:
    branches: [codex/maxroll-leveling-support]
    paths:
      - tools/apply-maxroll-main-temp.mjs
      - .github/workflows/maxroll-integrate-temp.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/maxroll-leveling-support
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/apply-maxroll-main-temp.mjs
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No integration changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/main.ts
          git commit -m "Wire Maxroll guides into build runtime"
          git push
