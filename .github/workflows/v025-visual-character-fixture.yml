name: v0.2.5 visual character fixture

on:
  push:
    branches: [feature/campaign-guide-2]
    paths:
      - tools/apply-v025-visual-character-fixture.mjs
      - .github/workflows/v025-visual-character-fixture.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/campaign-guide-2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node --check tools/apply-v025-visual-character-fixture.mjs
      - run: node tools/apply-v025-visual-character-fixture.mjs
      - run: npm ci
      - run: npm run visual:manager
      - name: Remove one-shot patch files
        shell: pwsh
        run: |
          Remove-Item tools/apply-v025-visual-character-fixture.mjs -Force
          Remove-Item .github/workflows/v025-visual-character-fixture.yml -Force
      - name: Commit validated visual fixture fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/visual-manager.ts tools/apply-v025-visual-character-fixture.mjs .github/workflows/v025-visual-character-fixture.yml
          git commit -m "Fix character-aware manager visual fixture"
          git push origin HEAD:feature/campaign-guide-2
