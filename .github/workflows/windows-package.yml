name: Windows package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:campaign
      - run: npm run lint:campaign
      - run: npm run simulate:campaign
      - name: Render overlay visual smoke matrix
        run: npm run visual:overlay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ExileQuesting-Overlay-Visuals-${{ github.sha }}
          path: artifacts/visual/*
          if-no-files-found: warn
          retention-days: 30
      - run: npm run dist
      - name: Verify setup executable
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem release -Filter 'ExileQuesting-*-setup.exe')
          if ($setup.Count -ne 1) { throw "Expected exactly one NSIS setup executable, found $($setup.Count)." }
          $setup | Format-Table Name, Length
      - name: Smoke test installed build
        shell: pwsh
        run: |
          $setup = Get-Item release/ExileQuesting-*-setup.exe
          $installDir = Join-Path $env:RUNNER_TEMP "ExileQuestingSmoke"
          $install = Start-Process -FilePath $setup.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer failed with exit code $($install.ExitCode)." }

          $installedExe = Join-Path $installDir "ExileQuesting.exe"
          if (-not (Test-Path $installedExe)) { throw "Installer completed but ExileQuesting.exe was not installed." }
          $installedRun = Start-Process -FilePath $installedExe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($installedRun.ExitCode -ne 0) { throw "Installed startup smoke test failed with exit code $($installedRun.ExitCode)." }

          $uninstaller = Join-Path $installDir "Uninstall ExileQuesting.exe"
          if (Test-Path $uninstaller) {
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall failed with exit code $($uninstall.ExitCode)." }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ExileQuesting-Windows-Setup-${{ github.sha }}
          path: release/ExileQuesting-*-setup.exe
          if-no-files-found: error
          retention-days: 30
