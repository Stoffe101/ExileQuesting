name: Windows package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist
      - name: Verify expected executables
        shell: pwsh
        run: |
          $files = Get-ChildItem release -Filter *.exe
          if ($files.Count -lt 2) { throw "Expected installer and portable executables." }
          $files | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: ExileQuesting-Windows-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

