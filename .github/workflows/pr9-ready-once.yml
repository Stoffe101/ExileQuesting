name: PR 9 ready helper

on:
  push:
    branches: [codex/pob-to-play-v0.2]

permissions:
  contents: write
  pull-requests: write

jobs:
  ready-and-clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pob-to-play-v0.2
          fetch-depth: 0
      - name: Mark PR 9 ready
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr ready 9 --repo Stoffe101/ExileQuesting
      - name: Remove this one-shot helper
        shell: bash
        run: |
          git rm .github/workflows/pr9-ready-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-shot PR ready helper"
          git push origin HEAD:codex/pob-to-play-v0.2
