name: Guide 2 one-shot route hardening

on:
  push:
    branches: [feature/campaign-guide-2]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/campaign-guide-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Harden route materialization and semantic lint
        shell: python
        run: |
          from pathlib import Path

          campaign = Path('src/core/campaign.ts')
          text = campaign.read_text(encoding='utf-8')
          old = """      const targetAreaId = areaIds.at(-1);
                const target = targetAreaId ? areas.get(targetAreaId) : undefined;
                return {
                  ...step,
                  title: step.annotation?.title ?? actions.find((action) => action.priority === 'now')?.title ?? inferTitle(rawLines, target?.name),"""
          new = """      const targetAreaId = areaIds.at(-1);
                const target = targetAreaId ? areas.get(targetAreaId) : undefined;
                const annotation = targetAreaId === step.targetAreaId ? step.annotation : undefined;
                return {
                  ...step,
                  title: annotation?.title ?? actions.find((action) => action.priority === 'now')?.title ?? inferTitle(rawLines, target?.name),"""
          if old not in text:
              raise SystemExit('campaign annotation marker missing')
          text = text.replace(old, new, 1)
          old = """        tags,
                  actions,
                  layoutHints: targetAreaId === step.targetAreaId ? step.layoutHints : undefined,
                  permanentReward:"""
          new = """        tags,
                  actions,
                  annotation,
                  layoutHints: targetAreaId === step.targetAreaId ? step.layoutHints : undefined,
                  permanentReward:"""
          if old not in text:
              raise SystemExit('campaign annotation return marker missing')
          text = text.replace(old, new, 1)
          campaign.write_text(text, encoding='utf-8')

          main = Path('electron/main.ts')
          text = main.read_text(encoding='utf-8')
          old = """  const demoProgress = Math.max(0, Math.min(Math.trunc(overlayDemo.progress), dataset.steps.length - 1));
            const step = dataset.steps[demoProgress];
            const previousAreaStep = dataset.steps.slice(0, demoProgress).reverse().find((candidate) => enabled(candidate) && (candidate.targetAreaId || candidate.targetArea) && (candidate.targetAreaId !== step.targetAreaId || candidate.targetArea !== step.targetArea));
            const detectedArea = previousAreaStep?.targetAreaId ? dataset.areas.find((area) => area.id === previousAreaStep.targetAreaId) : undefined;"""
          new = """  const demoProgress = Math.max(0, Math.min(Math.trunc(overlayDemo.progress), real.dataset.steps.length - 1));
            const step = real.dataset.steps[demoProgress];
            const previousAreaStep = real.dataset.steps.slice(0, demoProgress).reverse().find((candidate) => isStepEnabled(candidate, real.settings) && (candidate.targetAreaId || candidate.targetArea) && (candidate.targetAreaId !== step.targetAreaId || candidate.targetArea !== step.targetArea));
            const detectedArea = previousAreaStep?.targetAreaId ? real.dataset.areas.find((area) => area.id === previousAreaStep.targetAreaId) : undefined;"""
          if old not in text:
              raise SystemExit('overlay demo active dataset marker missing')
          text = text.replace(old, new, 1)
          main.write_text(text, encoding='utf-8')

          lint = Path('tools/lint-campaign.ts')
          text = lint.read_text(encoding='utf-8')
          old = "import { normalizeCampaign, validateCampaign } from '../src/core/campaign';"
          new = "import { campaignForRouteMode, isStepEnabled, normalizeCampaign, validateCampaign } from '../src/core/campaign';"
          if old not in text:
              raise SystemExit('lint campaign import marker missing')
          text = text.replace(old, new, 1)
          marker = """const layoutAuditCounts = { verified: 0, reviewed: 0, unaudited: 0, outdated: 0 };"""
          block = """for (const mode of [{ name: 'league-start', leagueStart: true }, { name: 'twink', leagueStart: false }]) {
            const active = campaignForRouteMode(dataset, mode.leagueStart);
            for (const [index, step] of active.steps.entries()) {
              if (!isStepEnabled(step, { leagueStart: mode.leagueStart, bandit: 'none', showOptional: true })) continue;
              if (step.rawLines.some((line) => mode.leagueStart ? /\\btwinkrun\\s*:/i.test(line) : /\\bleaguestart\\s*:/i.test(line))) {
                errors.push(`${mode.name} page ${index + 1} still contains an opposite-mode source line after materialization.`);
              }
              if (step.rawLines.length > 0 && !step.actions.some((action) => action.priority !== 'context')) {
                errors.push(`${mode.name} page ${index + 1} has no decisive action after line-mode filtering.`);
              }
              if (step.actions.some((action) => action.sourceLine && !step.rawLines.includes(action.sourceLine))) {
                errors.push(`${mode.name} page ${index + 1} contains an action sourced from a hidden line.`);
              }
            }
          }

          """ + marker
          if marker not in text:
              raise SystemExit('lint route-mode insertion marker missing')
          text = text.replace(marker, block, 1)
          lint.write_text(text, encoding='utf-8')
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/guide2-one-shot-route-hardening.yml
          git add src/core/campaign.ts electron/main.ts tools/lint-campaign.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Harden route mode correctness"
          git push origin HEAD:feature/campaign-guide-2
