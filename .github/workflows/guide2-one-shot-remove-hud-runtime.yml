name: Guide 2 retired HUD cleanup

on:
  push:
    branches:
      - feature/campaign-guide-2

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/campaign-guide-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Remove retired HUD runtime
        run: node tools/remove-retired-passive-hud.mjs
      - name: Remove obsolete files and commit
        run: |
          git rm electron/services/passive-tree-hud.ts
          git rm src/ui/PassiveTreeHudOverlay.tsx
          git rm src/ui/passive-tree-hud.css
          git rm src/ui/passive-tree-hud-style.test.ts
          git rm tools/visual-passive-tree-hud.ts
          git rm tools/remove-retired-passive-hud.mjs
          git rm .github/workflows/guide2-one-shot-remove-hud-runtime.yml
          git add electron/main.ts src/ui/App.tsx src/main.tsx package.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Remove retired Passive Tree HUD runtime"
          git push origin HEAD:feature/campaign-guide-2
