name: Generate passive tree snapshot

on:
  push:
    branches: [codex/build-aware-campaign-intelligence]
    paths:
      - tools/generate-passive-data.ts
      - .github/workflows/passive-data-generate-temp.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/build-aware-campaign-intelligence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate pinned PoE 3.29 passive tree snapshot
        run: npm run data:passives
      - name: Validate generated passive tree snapshot
        run: npm run validate:passives
      - name: Commit generated snapshot
        shell: bash
        run: |
          git add assets/game-data/passive-tree-3.29.json
          if git diff --cached --quiet; then
            echo "Passive tree snapshot unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate pinned PoE 3.29 passive tree snapshot"
          git push origin HEAD:codex/build-aware-campaign-intelligence
