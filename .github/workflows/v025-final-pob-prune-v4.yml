name: v0.2.5 final PoB pruning proof

on:
  push:
    branches:
      - feature/campaign-guide-2
    paths:
      - tools/apply-v025-pob-prune.py
      - .github/workflows/v025-final-pob-prune-v4.yml

permissions:
  contents: write

jobs:
  prove:
    runs-on: windows-2025
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/campaign-guide-2
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply pruning patch
        run: python tools/apply-v025-pob-prune.py
      - run: npm run typecheck
      - run: npm test
      - name: Build, stage, and prove pinned PoB runtime
        run: npm run prepare:pob-runtime:win
      - name: Re-run staged PoB proof
        run: npm run smoke:pob-runtime
      - name: Commit validated source
        shell: pwsh
        run: |
          git config user.name "Skrra"
          git config user.email "94893570+Stoffe101@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Slim pinned PoB runtime for v0.2.5 playtest"
          git push origin HEAD:feature/campaign-guide-2

# Trigger revision: 2
