name: v0.2.5 safe character identity

on:
  push:
    branches: [feature/campaign-guide-2]
    paths:
      - tools/apply-safe-character-name.mjs
      - .github/workflows/v025-safe-character-name.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/campaign-guide-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node --check tools/apply-safe-character-name.mjs
      - run: node tools/apply-safe-character-name.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Remove one-shot patch files
        run: |
          rm -f tools/apply-safe-character-name.mjs
          rm -f .github/workflows/v025-safe-character-name.yml
      - name: Commit validated safety patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Require explicit character identity confirmation"
          git push origin HEAD:feature/campaign-guide-2
