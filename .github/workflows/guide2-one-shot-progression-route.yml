name: Guide 2 one-shot progression route

on:
  push:
    branches: [feature/campaign-guide-2]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/campaign-guide-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Use materialized route for live progression
        shell: python
        run: |
          from pathlib import Path
          path = Path('electron/main.ts')
          text = path.read_text(encoding='utf-8')

          helper = "function enabled(step: CampaignDataset['steps'][number]): boolean { return isStepEnabled(step, settings); }"
          helper_with_progression = helper + "\nfunction progressionSteps(): CampaignDataset['steps'] { return campaignForRouteMode(dataset, settings.leagueStart).steps; }"
          if 'function progressionSteps()' not in text:
              if helper not in text:
                  raise SystemExit('enabled helper missing')
              text = text.replace(helper, helper_with_progression, 1)

          live = "decision = decideProgression(dataset.steps, progress, event, { isStepEnabled: (step) => enabled(step), currentAreaId: previousAreaId, currentAreaName: previousAreaName, recentAreaIds, recentAreaNames });"
          live_new = "const activeSteps = progressionSteps();\n    decision = decideProgression(activeSteps, progress, event, { isStepEnabled: (step) => enabled(step), currentAreaId: previousAreaId, currentAreaName: previousAreaName, recentAreaIds, recentAreaNames });"
          if live not in text:
              raise SystemExit('live decideProgression call missing')
          text = text.replace(live, live_new, 1)

          startup = "const decision = decideProgression(dataset.steps, progress, event, { isStepEnabled: (step) => enabled(step), currentAreaId: previousAreaId, currentAreaName: previousAreaName, recentAreaIds, recentAreaNames });"
          startup_new = "const activeSteps = progressionSteps();\n  const decision = decideProgression(activeSteps, progress, event, { isStepEnabled: (step) => enabled(step), currentAreaId: previousAreaId, currentAreaName: previousAreaName, recentAreaIds, recentAreaNames });"
          if startup not in text:
              raise SystemExit('startup decideProgression call missing')
          text = text.replace(startup, startup_new, 1)

          reconciliation = "reconcileStartup(dataset.steps, progress, event, (step) => enabled(step))"
          if reconciliation not in text:
              raise SystemExit('startup reconcile call missing')
          text = text.replace(reconciliation, "reconcileStartup(activeSteps, progress, event, (step) => enabled(step))", 1)

          path.write_text(text, encoding='utf-8')
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/guide2-one-shot-progression-route.yml
          git add electron/main.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Use materialized route for automatic progression"
          git push origin HEAD:feature/campaign-guide-2
