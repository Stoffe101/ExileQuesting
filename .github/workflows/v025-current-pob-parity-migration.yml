name: v0.2.5 current-tree PoB parity migration

on:
  push:
    branches:
      - feature/campaign-guide-2
    paths:
      - .github/workflows/v025-current-pob-parity-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/campaign-guide-2
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply current-tree parity migration
        run: python tools/apply-current-pob-parity.py
      - run: npm run typecheck
      - run: npm test
      - name: Commit type-safe parity migration
        run: |
          git config user.name "Skrra"
          git config user.email "94893570+Stoffe101@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align PoB parity with the 3.29 embedded kernel"
          git push origin HEAD:feature/campaign-guide-2

# Trigger revision: 2
