name: Passive HUD live-play hotfix

on:
  push:
    branches: [feature/playtest-hardening]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply guarded hotfix once
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" = "0.2.1" ]; then
            node tools/apply-passive-hud-hotfix.mjs
          else
            echo "Hotfix already applied at version $VERSION"
          fi
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:passives
      - run: npm run build
      - name: Commit verified hotfix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "Skrra"
          git config user.email "94893570+Stoffe101@users.noreply.github.com"
          git add electron/main.ts electron/services/passive-tree-hud.ts package.json package-lock.json .github/workflows/release.yml
          git commit -m "Fix Passive Tree HUD activation and performance"
          git push
