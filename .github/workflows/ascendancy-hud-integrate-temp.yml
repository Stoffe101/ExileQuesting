name: Ascendancy HUD integration temp

on:
  push:
    branches:
      - feature/passive-tree-hud
    paths:
      - .github/workflows/ascendancy-hud-integrate-temp.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/passive-tree-hud
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply scope-local Ascendancy HUD patches
        run: node tools/ascendancy-hud-patch-temp.mjs
      - name: Install dependencies
        run: npm ci
      - name: Regenerate PoE 3.29 passive geometry
        run: npm run data:passives
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Validate passive snapshot
        run: npm run validate:passives
      - name: Validate gems
        run: npm run validate:gems
      - name: Build production app
        run: npm run build
      - name: Remove temporary research/integration files
        run: |
          git rm .github/workflows/ascendancy-probe-temp.yml
          git rm .github/workflows/ascendancy-hud-integrate-temp.yml
          git rm tools/ascendancy-hud-patch-temp.mjs
      - name: Commit integrated Ascendancy HUD
        shell: bash
        run: |
          git config user.name "Skrra"
          git config user.email "94893570+Stoffe101@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add full Ascendancy Passive Tree HUD support"
          git push origin HEAD:feature/passive-tree-hud
