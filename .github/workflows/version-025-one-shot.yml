name: Version 0.2.5 metadata

on:
  push:
    branches:
      - feature/campaign-guide-2

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/campaign-guide-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm version 0.2.5 --no-git-tag-version --allow-same-version
      - name: Commit version metadata
        run: |
          git rm .github/workflows/version-025-one-shot.yml
          git add package.json package-lock.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Bump ExileQuesting to v0.2.5"
          git push origin HEAD:feature/campaign-guide-2
