name: Passive tree research temp

on:
  push:
    branches: [feature/passive-tree-hud]
    paths:
      - src/core/passive-data.ts
      - src/core/passive-tree-hud.ts
      - src/core/passive-tree-hud.test.ts
      - src/core/passive-tree-vision.ts
      - src/core/passive-tree-vision.test.ts
      - electron/services/passive-tree-hud.ts
      - tools/generate-passive-data.ts
      - tools/inspect-passive-tree-temp.mjs
      - tools/apply-passive-hud-integration-temp.py
      - .github/workflows/passive-tree-research-temp.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/passive-tree-hud
      - name: Apply guarded runtime integration
        run: python3 tools/apply-passive-hud-integration-temp.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Inspect passive schema and class starts
        run: node tools/inspect-passive-tree-temp.mjs
      - run: npm run data:passives
      - run: npm run validate:passives
      - run: npm run typecheck
      - run: npm test
      - name: Commit validated integration and generated passive snapshot
        run: |
          git config user.name "Skrra"
          git config user.email "94893570+Stoffe101@users.noreply.github.com"
          git add assets/game-data/passive-tree-3.29.json electron/main.ts src/core/persistence.ts src/core/maxroll.ts src/ui/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Integrate all-class Passive Tree HUD runtime"
          git push origin HEAD:feature/passive-tree-hud
