name: Passive tree research temp

on:
  push:
    branches: [feature/passive-tree-hud]
    paths:
      - tools/inspect-passive-tree-temp.mjs
      - .github/workflows/passive-tree-research-temp.yml

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/inspect-passive-tree-temp.mjs
