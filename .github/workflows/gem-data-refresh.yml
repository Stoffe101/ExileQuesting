name: Refresh pinned gem data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate pinned PoE gem snapshot
        run: npm run data:gems
      - name: Generate game-data provenance manifest
        run: npm run data:manifest
      - name: Verify deterministic gem snapshot
        run: npm run check:gems
      - name: Validate generated gem snapshot
        run: npm run validate:gems
      - name: Validate game-data provenance manifest
        run: npm run validate:manifest
      - name: Commit generated snapshot and manifest when changed
        shell: bash
        run: |
          git add assets/game-data/gem-acquisition-3.29.json assets/game-data/manifest.json
          if git diff --cached --quiet; then
            echo "Pinned gem snapshot and manifest are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate pinned PoE 3.29 gem acquisition snapshot"
          git push origin "HEAD:${{ github.ref_name }}"
