name: Temporary v0.1.4 patch runner 2

on:
  push:
    branches:
      - codex/v0.1.4-lab-updater-hotfix
    paths:
      - '.github/workflows/tmp-v014-patch2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0.1.4-lab-updater-hotfix
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply source patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          rep('src/ui/App.tsx', "} from './reliability';\n", "} from './reliability';\nimport PreplaytestLab from './PreplaytestLab';\n")
          rep('src/ui/App.tsx', "  return mode === 'overlay' ? <Overlay state={state} /> : <Manager state={state} setState={setState} />;\n", "  if (mode === 'overlay') return <Overlay state={state} />;\n  if (mode === 'lab') return <PreplaytestLab state={state} setState={setState} />;\n  return <Manager state={state} setState={setState} />;\n")

          rep('electron/main.ts', "import { appendHistory, decideProgression, makeHistoryEntry, reconcileStartup } from '../src/core/progression';\n", "import { appendHistory, decideProgression, makeHistoryEntry, reconcileStartup } from '../src/core/progression';\nimport { runCampaignSimulationSuite } from '../src/core/simulation-suite';\n")
          rep('electron/main.ts', "const APP_RELEASE_REPOSITORY = 'Stoffe101/ExileQuesting-Releases';", "const APP_RELEASE_REPOSITORY = 'Stoffe101/ExileQuesting';")
          rep('electron/main.ts', "async function loadRenderer(window: BrowserWindow, mode: 'manager' | 'overlay'): Promise<void> {", "async function loadRenderer(window: BrowserWindow, mode: 'manager' | 'overlay' | 'lab'): Promise<void> {")
          rep('electron/main.ts', "  labWindow = createPreplaytestLab(path.join(__dirname, 'preload.cjs'));\n  wireWindowDiagnostics(labWindow, 'Pre-playtest Lab');\n  labWindow.on('closed', () => { labWindow = null; overlayDemo = null; broadcastState(); });\n", "  labWindow = createPreplaytestLab(path.join(__dirname, 'preload.cjs'), !app.isPackaged);\n  wireWindowDiagnostics(labWindow, 'Pre-playtest Lab');\n  void loadRenderer(labWindow, 'lab').catch((error) => log.error('Failed to load Pre-playtest Lab UI.', error));\n  labWindow.on('closed', () => { labWindow = null; overlayDemo = null; broadcastState(); });\n")
          rep('electron/main.ts', "  ipcMain.handle('overlay:demo-stop', () => { overlayDemo = null; broadcastState(); return runtimeState(); });\n", "  ipcMain.handle('overlay:demo-stop', () => { overlayDemo = null; broadcastState(); return runtimeState(); });\n  ipcMain.handle('simulation:run', () => runCampaignSimulationSuite(dataset));\n")

          rep('electron/services/app-updater.ts', "import path from 'node:path';\n", "import path from 'node:path';\nimport { scheduleWindowsUpdate } from './update-handoff';\n")
          start = Path('electron/services/app-updater.ts').read_text(encoding='utf-8')
          old_start = start.index('  async installOnExit(): Promise<boolean> {')
          old_end = start.index('\n  }\n}', old_start) + len('\n  }')
          new_method = '''  async installOnExit(): Promise<boolean> {\n    if (!this.downloadedPath || this.state.status !== 'ready') return false;\n    try {\n      await scheduleWindowsUpdate({\n        installerPath: this.downloadedPath,\n        updatesDirectory: this.options.updatesDirectory,\n        log: this.options.log,\n      });\n      this.options.log?.info(`Scheduled update installer after exit: ${this.downloadedPath}`);\n      return true;\n    } catch (error) {\n      const message = error instanceof Error ? error.message : String(error);\n      this.options.log?.warn('Failed to schedule application update installation.', error);\n      this.setState({ status: 'error', error: message, message: `Could not start the update installer. ${message}` });\n      return false;\n    }\n  }'''
          Path('electron/services/app-updater.ts').write_text(start[:old_start] + new_method + start[old_end:], encoding='utf-8')

          p = Path('package.json')
          package = p.read_text(encoding='utf-8')
          package = package.replace('"version": "0.1.3"', '"version": "0.1.4"', 1)
          p.write_text(package, encoding='utf-8')
          PY
      - name: Synchronize package-lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui/App.tsx electron/main.ts electron/services/app-updater.ts package.json package-lock.json
          git commit -m 'Wire v0.1.4 Lab and updater fixes'
          git push origin HEAD:codex/v0.1.4-lab-updater-hotfix
