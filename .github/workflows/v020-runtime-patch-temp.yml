name: v0.2 runtime patch

on:
  push:
    branches: [feature/v0.2-player-coach]
    paths:
      - tools/apply-v020-main-patch-temp.mjs
      - .github/workflows/v020-runtime-patch-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.2-player-coach
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/apply-v020-main-patch-temp.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Commit runtime integration
        run: |
          git config user.name "Skrra"
          git config user.email "94893570+Stoffe101@users.noreply.github.com"
          git add electron/main.ts
          git diff --cached --quiet && exit 0
          git commit -m "Integrate Gear Coach runtime and local PoB import"
          git push origin HEAD:feature/v0.2-player-coach
