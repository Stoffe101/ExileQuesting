name: Temporary package-lock license sync

on:
  push:
    branches:
      - codex/responsive-manager-layout
    paths:
      - '.github/workflows/tmp-sync-license-lock.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/responsive-manager-layout
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Synchronize root package-lock license metadata
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.packages[''].license = 'SEE LICENSE IN LICENSE';
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE
      - name: Commit synchronized lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Synchronize package-lock license metadata'
          git push origin HEAD:codex/responsive-manager-layout
