name: Guide 2 one-shot runtime cleanup

on:
  push:
    branches: [feature/campaign-guide-2]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/campaign-guide-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Remove retired Passive Tree HUD startup path
        shell: python
        run: |
          from pathlib import Path
          path = Path('electron/main.ts')
          text = path.read_text(encoding='utf-8')
          old = """    mainWindow = createMainWindow();
              overlayWindow = createOverlayWindow();
              passiveTreeHudWindow = createPassiveTreeHudWindow();
              initializePassiveTreeHud();
              createTray();"""
          new = """    mainWindow = createMainWindow();
              overlayWindow = createOverlayWindow();
              // Campaign Guide 2 retired the passive-tree screen HUD. Do not create its
              // full-screen BrowserWindow or start any related runtime service. Keeping
              // legacy state/types for one migration cycle must never affect capture.
              passiveTreeHudState = passiveTreeHudIdle(false);
              createTray();"""
          if old not in text:
              raise SystemExit('Expected passive HUD startup block not found; refusing broad rewrite.')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Remove this one-shot workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/guide2-one-shot-refactor.yml
          git add electron/main.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Stop creating retired Passive Tree HUD runtime"
          git push origin HEAD:feature/campaign-guide-2
