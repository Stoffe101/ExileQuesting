name: Final preplaytest Electron patch once

on:
  push:
    branches: [codex/pre-playtest-simulator-hardening]

permissions:
  contents: write

jobs:
  patch-main:
    if: github.event.head_commit.message != 'Finish Electron pre-playtest hardening [bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pre-playtest-simulator-hardening
          fetch-depth: 0
      - name: Patch Electron entrypoint
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'electron/main.ts';
          let text = fs.readFileSync(file, 'utf8');
          function replaceOnce(from, to, label) {
            if (text.includes(to)) return;
            if (!text.includes(from)) throw new Error('Missing patch anchor: ' + label);
            text = text.replace(from, to);
          }

          replaceOnce(
            "import { createPreplaytestLab } from './services/preplaytest-lab';",
            "import { createPreplaytestLab } from './services/preplaytest-lab';\nimport { runOverlayWindowSoak } from './services/overlay-soak';\nimport { importPobBuild } from './services/pob-service';\nimport { defaultBuildProfileName, upsertBuildProfile, type BuildProfile } from '../src/core/build-profiles';",
            'service imports',
          );
          replaceOnce(
            "const visualSmokeArgument = process.argv.find((argument) => argument.startsWith('--visual-smoke='));",
            "const visualSmokeArgument = process.argv.find((argument) => argument.startsWith('--visual-smoke='));\nconst overlaySoakArgument = process.argv.find((argument) => argument.startsWith('--overlay-soak='));",
            'soak argument',
          );
          replaceOnce(
            "let characterLevel: number | undefined;",
            "let characterLevel: number | undefined;\nlet recentAreaIds: string[] = [];\nlet recentAreaNames: string[] = [];",
            'recent area globals',
          );
          replaceOnce(
            "let lastReplay: ReplayUiResult | null = null;",
            "let lastReplay: ReplayUiResult | null = null;\nlet buildProfiles: BuildProfile[] = [];",
            'build profiles global',
          );

          const oldLoad = `async function loadPersistentState(): Promise<void> {\n  settings = await store.loadSettings(DEFAULT_SETTINGS);\n  const savedProgress = await store.loadProgress();\n  progress = savedProgress.progress;\n  progressHistory = savedProgress.history;\n  const run = await store.loadRun();\n  runSession = run.session;\n  runHistory = run.history;\n}`;
          const newLoad = `async function loadPersistentState(): Promise<void> {\n  settings = await store.loadSettings(DEFAULT_SETTINGS);\n  const run = await store.loadRun();\n  runSession = run.session;\n  runHistory = run.history;\n  buildProfiles = await store.loadBuildProfiles();\n}`;
          replaceOnce(oldLoad, newLoad, 'persistent load ordering');

          replaceOnce(
            "  progress = Math.max(0, Math.min(progress, dataset.steps.length - 1));\n  const knownRewardIds = new Set(dataset.steps.filter((step) => step.permanentReward).map((step) => step.id));",
            "  const savedProgress = await store.loadProgress(dataset.steps.length - 1);\n  progress = savedProgress.progress;\n  progressHistory = savedProgress.history;\n  const knownRewardIds = new Set(dataset.steps.filter((step) => step.permanentReward).map((step) => step.id));",
            'dataset-aware progress load',
          );

          replaceOnce(
            "async function setProgress(nextProgress: number, reason = 'Manual progress change', confidence: 'manual' | 'verified' | 'inferred' = 'manual', automatic = false, event?: ZoneEvent): Promise<void> {\n  const next = Math.max(0, Math.min(Math.trunc(nextProgress), dataset.steps.length - 1));",
            "async function setProgress(nextProgress: number, reason = 'Manual progress change', confidence: 'manual' | 'verified' | 'inferred' = 'manual', automatic = false, event?: ZoneEvent): Promise<void> {\n  const parsedProgress = Number(nextProgress);\n  if (!Number.isFinite(parsedProgress)) return;\n  const next = Math.max(0, Math.min(Math.trunc(parsedProgress), dataset.steps.length - 1));",
            'progress input guard',
          );

          replaceOnce(
            "function updateCurrentArea(event: ZoneEvent): void {",
            `function appendRecentArea(values: string[], value?: string, limit = 8): string[] {\n  if (!value) return values;\n  return [...values.filter((candidate) => candidate !== value), value].slice(-limit);\n}\nfunction updateCurrentArea(event: ZoneEvent): void {`,
            'recent area helper',
          );

          replaceOnce(
            `  const previousAreaId = currentAreaId || undefined;\n  const previousAreaName = currentZone || undefined;\n  updateCurrentArea(event);\n  await updateRunFromZone(event);`,
            `  const previousAreaId = currentAreaId || undefined;\n  const previousAreaName = currentZone || undefined;\n  const normalizedIncomingName = event.areaName?.trim().toLowerCase();\n  const normalizedPreviousName = previousAreaName?.trim().toLowerCase();\n  const distinctArea = event.type !== 'character-level' && (\n    event.areaId ? event.areaId !== previousAreaId : Boolean(normalizedIncomingName && normalizedIncomingName !== normalizedPreviousName)\n  );\n  if (distinctArea) {\n    recentAreaIds = appendRecentArea(recentAreaIds, previousAreaId);\n    recentAreaNames = appendRecentArea(recentAreaNames, previousAreaName);\n  }\n  updateCurrentArea(event);\n  await updateRunFromZone(event);`,
            'runtime recent area capture',
          );
          replaceOnce(
            "decision = decideProgression(dataset.steps, progress, event, { isStepEnabled: (step) => enabled(step), currentAreaId: previousAreaId, currentAreaName: previousAreaName });",
            "decision = decideProgression(dataset.steps, progress, event, { isStepEnabled: (step) => enabled(step), currentAreaId: previousAreaId, currentAreaName: previousAreaName, recentAreaIds, recentAreaNames });",
            'runtime recent history decision',
          );
          replaceOnce(
            "const decision = decideProgression(dataset.steps, progress, event, { isStepEnabled: (step) => enabled(step), currentAreaId: previousAreaId, currentAreaName: previousAreaName });",
            "const decision = decideProgression(dataset.steps, progress, event, { isStepEnabled: (step) => enabled(step), currentAreaId: previousAreaId, currentAreaName: previousAreaName, recentAreaIds, recentAreaNames });",
            'startup recent history decision',
          );

          const oldSettingsStart = "ipcMain.handle('settings:update', async (_event, patch: Partial<AppSettings>) => {\n    const candidate = {\n      ...settings, ...patch,\n      hotkeys: patch.hotkeys ? { ...settings.hotkeys, ...patch.hotkeys } : settings.hotkeys,\n      overlayTypography: patch.overlayTypography ? { ...settings.overlayTypography, ...patch.overlayTypography } : settings.overlayTypography,\n      overlayPosition: patch.overlayPosition ? { ...settings.overlayPosition, ...patch.overlayPosition } : settings.overlayPosition,";
          const newSettingsStart = "ipcMain.handle('settings:update', async (_event, patch: unknown) => {\n    const safePatch = patch && typeof patch === 'object' && !Array.isArray(patch) ? patch as Partial<AppSettings> : {};\n    const candidate = {\n      ...settings, ...safePatch,\n      hotkeys: safePatch.hotkeys ? { ...settings.hotkeys, ...safePatch.hotkeys } : settings.hotkeys,\n      overlayTypography: safePatch.overlayTypography ? { ...settings.overlayTypography, ...safePatch.overlayTypography } : settings.overlayTypography,\n      overlayPosition: safePatch.overlayPosition ? { ...settings.overlayPosition, ...safePatch.overlayPosition } : settings.overlayPosition,";
          replaceOnce(oldSettingsStart, newSettingsStart, 'settings IPC object guard');
          const settingsBlockStart = text.indexOf("ipcMain.handle('settings:update'");
          const settingsBlockEnd = text.indexOf("ipcMain.handle('log:select'", settingsBlockStart);
          if (settingsBlockStart < 0 || settingsBlockEnd < 0) throw new Error('Could not locate settings block.');
          const settingsBlock = text.slice(settingsBlockStart, settingsBlockEnd).replace(/\bpatch\./g, 'safePatch.');
          text = text.slice(0, settingsBlockStart) + settingsBlock + text.slice(settingsBlockEnd);

          replaceOnce(
            "  ipcMain.handle('diagnostics:replay', async () => replayCapturedLog());",
            `  ipcMain.handle('diagnostics:replay', async () => replayCapturedLog());\n  ipcMain.handle('pob:list', () => buildProfiles);\n  ipcMain.handle('pob:import', async (_event, input: unknown) => {\n    if (typeof input !== 'string') throw new Error('PoB input must be text.');\n    const imported = await importPobBuild(input, app.getVersion());\n    const profile: BuildProfile = { ...imported, name: defaultBuildProfileName(imported.build) };\n    buildProfiles = upsertBuildProfile(buildProfiles, profile);\n    await store.saveBuildProfiles(buildProfiles);\n    return buildProfiles;\n  });\n  ipcMain.handle('pob:delete', async (_event, id: unknown) => {\n    if (typeof id !== 'string' || id.length > 256) return buildProfiles;\n    buildProfiles = buildProfiles.filter((profile) => profile.id !== id);\n    await store.saveBuildProfiles(buildProfiles);\n    return buildProfiles;\n  });`,
            'PoB profile IPC',
          );

          const visualStart = text.indexOf('async function runVisualSmoke(');
          const visualEnd = text.indexOf("\n\nprocess.on('uncaughtException'", visualStart);
          if (visualStart < 0 || visualEnd < 0) throw new Error('Could not locate visual smoke function.');
          const visualReplacement = `async function runVisualSmoke(outputArgument: string): Promise<void> {\n  if (!overlayWindow) throw new Error('Overlay window is unavailable for visual smoke testing.');\n  const output = path.resolve(outputArgument.split('=').slice(1).join('=') || 'artifacts/visual');\n  await fs.mkdir(output, { recursive: true });\n  await waitForRenderer(overlayWindow);\n  const warningIndex = Math.max(0, dataset.steps.findIndex((step) => step.annotation?.warning));\n  const passiveIndex = Math.max(0, dataset.steps.findIndex((step) => step.permanentReward === 'passive'));\n  const coachIndex = Math.max(0, dataset.steps.findIndex((step) => step.annotation?.details?.length && step.annotation?.speedrun));\n  const longIndex = Math.max(0, dataset.steps.reduce((best, step, index, steps) => step.title.length > steps[best].title.length ? index : best, 0));\n  const compactTypography = { ...DEFAULT_SETTINGS.overlayTypography, preset: 'compact' as const, objective: 18, actions: 13, guidance: 11, labels: 9, status: 9, density: 'compact' as const };\n  const largeTypography = { ...DEFAULT_SETTINGS.overlayTypography, preset: 'large' as const, objective: 24, actions: 17, guidance: 15, labels: 11, status: 11 };\n  const extraTypography = { ...DEFAULT_SETTINGS.overlayTypography, preset: 'extra-large' as const, objective: 28, actions: 20, guidance: 17, labels: 13, status: 13, density: 'spacious' as const };\n  const scenarios = [\n    { name: 'compact-default-start', progress: 0, mode: 'compact' as const, typography: DEFAULT_SETTINGS.overlayTypography, scale: 1 },\n    { name: 'focus-default-start', progress: 0, mode: 'focus' as const, typography: DEFAULT_SETTINGS.overlayTypography, scale: 1 },\n    { name: 'coach-default-start', progress: 0, mode: 'coach' as const, typography: DEFAULT_SETTINGS.overlayTypography, scale: 1 },\n    { name: 'focus-compact-long', progress: longIndex, mode: 'focus' as const, typography: compactTypography, scale: 0.9 },\n    { name: 'compact-large-warning', progress: warningIndex, mode: 'compact' as const, typography: largeTypography, scale: 1.1 },\n    { name: 'focus-extra-large-passive', progress: passiveIndex, mode: 'focus' as const, typography: extraTypography, scale: 1.15 },\n    { name: 'coach-large-guidance', progress: coachIndex, mode: 'coach' as const, typography: largeTypography, scale: 1 },\n    { name: 'coach-extra-large-guidance', progress: coachIndex, mode: 'coach' as const, typography: extraTypography, scale: 1.15 },\n  ];\n  const captures: Array<Record<string, unknown>> = [];\n  for (const scenario of scenarios) {\n    settings = normalizeSettingsDocument({ ...settings, overlayMode: scenario.mode, overlayTypography: scenario.typography, overlayScale: scenario.scale, overlayAutoCollapse: false }, DEFAULT_SETTINGS);\n    overlayDemo = { progress: scenario.progress, mode: scenario.mode };\n    broadcastState(); overlayWindow.showInactive();\n    await new Promise((resolve) => setTimeout(resolve, 650));\n    const metrics = await overlayWindow.webContents.executeJavaScript(`(() => { const shell=document.querySelector('.overlay-shell'); if(!shell) return {missing:true}; const root=document.documentElement; const body=document.body; return {missing:false, innerWidth:window.innerWidth, innerHeight:window.innerHeight, shellClientWidth:shell.clientWidth, shellScrollWidth:shell.scrollWidth, shellClientHeight:shell.clientHeight, shellScrollHeight:shell.scrollHeight, rootScrollWidth:root.scrollWidth, bodyScrollWidth:body.scrollWidth}; })()`, true) as Record<string, number | boolean>;\n    if (metrics.missing) throw new Error('Overlay shell was missing in visual scenario ' + scenario.name + '.');\n    const innerWidth = Number(metrics.innerWidth);\n    if (Number(metrics.shellScrollWidth) > Number(metrics.shellClientWidth) + 3 || Number(metrics.rootScrollWidth) > innerWidth + 3 || Number(metrics.bodyScrollWidth) > innerWidth + 3) {\n      throw new Error('Horizontal overflow detected in visual scenario ' + scenario.name + '.');\n    }\n    const image = await overlayWindow.capturePage();\n    const png = image.toPNG();\n    const size = image.getSize();\n    if (!png.length || size.width < 250 || size.height < 100 || size.height > 1800) throw new Error('Visual scenario ' + scenario.name + ' produced suspicious bounds ' + size.width + 'x' + size.height + '.');\n    await fs.writeFile(path.join(output, scenario.name + '.png'), png);\n    captures.push({ name: scenario.name, width: size.width, height: size.height, bytes: png.length, scale: scenario.scale, metrics });\n  }\n  await fs.writeFile(path.join(output, 'manifest.json'), JSON.stringify({ generatedAt: new Date().toISOString(), captures }, null, 2), 'utf8');\n  log.info('Overlay visual smoke generated ' + captures.length + ' captures in ' + output + '.');\n  overlayDemo = null;\n}\n\nasync function runOverlaySoak(outputArgument: string): Promise<void> {\n  if (!overlayWindow) throw new Error('Overlay window is unavailable for soak testing.');\n  const output = path.resolve(outputArgument.split('=').slice(1).join('=') || 'artifacts/soak');\n  await waitForRenderer(overlayWindow);\n  overlayDemo = { progress: Math.min(40, dataset.steps.length - 1), mode: 'focus' };\n  broadcastState();\n  const report = await runOverlayWindowSoak(overlayWindow, output, 220);\n  log.info('Overlay soak completed: ' + report.iterations + ' iterations, ' + report.successfulRendererProbes + ' renderer probes.');\n  overlayDemo = null;\n}`;
          text = text.slice(0, visualStart) + visualReplacement + text.slice(visualEnd);

          replaceOnce(
            `    if (visualSmokeArgument) {\n      overlayWindow = createOverlayWindow();\n      await runVisualSmoke(visualSmokeArgument);\n      app.exit(0);\n      return;\n    }`,
            `    if (visualSmokeArgument || overlaySoakArgument) {\n      overlayWindow = createOverlayWindow();\n      if (visualSmokeArgument) await runVisualSmoke(visualSmokeArgument);\n      else if (overlaySoakArgument) await runOverlaySoak(overlaySoakArgument);\n      app.exit(0);\n      return;\n    }`,
            'test harness startup',
          );
          replaceOnce(
            "    if (isSmokeTest || visualSmokeArgument) { app.exit(1); return; }",
            "    if (isSmokeTest || visualSmokeArgument || overlaySoakArgument) { app.exit(1); return; }",
            'test harness failure exit',
          );

          fs.writeFileSync(file, text);
          NODE
      - name: Commit branch patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/main.ts
          git commit -m "Finish Electron pre-playtest hardening [bot]"
          git push origin HEAD:codex/pre-playtest-simulator-hardening
