name: Guide 2 one-shot route modes

on:
  push:
    branches: [feature/campaign-guide-2]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/campaign-guide-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Materialize Exile-UI line modes into runtime campaign data
        shell: python
        run: |
          from pathlib import Path

          campaign = Path('src/core/campaign.ts')
          text = campaign.read_text(encoding='utf-8')
          old_import = "import { buildRouteActions } from './actions';"
          new_import = "import { actionsForRouteMode, buildRouteActions, sourceLineVisibleForRouteMode } from './actions';"
          if old_import not in text:
              raise SystemExit('campaign actions import marker missing')
          text = text.replace(old_import, new_import, 1)

          marker = """  return { schemaVersion: 2, source, steps, acts, areas: [...areas.values()] };
          }

          export function validateCampaign"""
          insertion = """  return { schemaVersion: 2, source, steps, acts, areas: [...areas.values()] };
          }

          /**
           * Materialize Exile-UI's line-level leaguestart:/twinkrun: semantics without
           * deleting steps or changing their stable IDs/progress indexes.
           */
          export function campaignForRouteMode(dataset: CampaignDataset, leagueStart: boolean): CampaignDataset {
            const areas = new Map(dataset.areas.map((area) => [area.id, area]));
            return {
              ...dataset,
              steps: dataset.steps.map((step) => {
                const visibleIndexes = step.rawLines
                  .map((line, index) => ({ line, index }))
                  .filter(({ line }) => sourceLineVisibleForRouteMode(line, leagueStart))
                  .map(({ index }) => index);
                const rawLines = visibleIndexes.map((index) => step.rawLines[index]);
                const lines = visibleIndexes.map((index) => step.lines[index]).filter((line): line is string => typeof line === 'string');
                const actions = actionsForRouteMode(step.actions, leagueStart);
                const tags = tagsFor(rawLines);
                const areaIds = extractAreaIds(rawLines);
                const targetAreaId = areaIds.at(-1);
                const target = targetAreaId ? areas.get(targetAreaId) : undefined;
                return {
                  ...step,
                  title: step.annotation?.title ?? actions.find((action) => action.priority === 'now')?.title ?? inferTitle(rawLines, target?.name),
                  targetAreaId,
                  targetArea: target?.name,
                  areaLevel: target?.lvl,
                  rawLines,
                  lines,
                  tags,
                  actions,
                  layoutHints: targetAreaId === step.targetAreaId ? step.layoutHints : undefined,
                  permanentReward: isPermanentRewardStep(tags),
                };
              }),
            };
          }

          export function validateCampaign"""
          if marker not in text:
              raise SystemExit('campaign insertion marker missing')
          text = text.replace(marker, insertion, 1)
          campaign.write_text(text, encoding='utf-8')

          rewards = Path('src/core/rewards.ts')
          text = rewards.read_text(encoding='utf-8')
          old = """export function rewardProgressFor(dataset: CampaignDataset, progress: number): RewardProgress {
            const passives = dataset.steps.filter((step) => step.permanentReward === 'passive');
            const trials = dataset.steps.filter((step) => step.permanentReward === 'trial');"""
          new = """export function rewardProgressFor(
            dataset: CampaignDataset,
            progress: number,
            enabled: (step: CampaignDataset['steps'][number]) => boolean = () => true,
          ): RewardProgress {
            const passives = dataset.steps.filter((step) => enabled(step) && step.permanentReward === 'passive');
            const trials = dataset.steps.filter((step) => enabled(step) && step.permanentReward === 'trial');"""
          if old not in text:
              raise SystemExit('rewardProgressFor marker missing')
          text = text.replace(old, new, 1)
          old = """  confirmedStepIds: ReadonlySet<string> = new Set(),
          ): RewardAudit {
            const items = dataset.steps.flatMap((step, stepIndex) => {
              if (!step.permanentReward) return [];"""
          new = """  confirmedStepIds: ReadonlySet<string> = new Set(),
            enabled: (step: CampaignDataset['steps'][number]) => boolean = () => true,
          ): RewardAudit {
            const items = dataset.steps.flatMap((step, stepIndex) => {
              if (!enabled(step) || !step.permanentReward) return [];"""
          if old not in text:
              raise SystemExit('buildRewardAudit marker missing')
          text = text.replace(old, new, 1)
          rewards.write_text(text, encoding='utf-8')

          main = Path('electron/main.ts')
          text = main.read_text(encoding='utf-8')
          old = "import { normalizeCampaign, isStepEnabled, validateCampaign } from '../src/core/campaign';"
          new = "import { campaignForRouteMode, normalizeCampaign, isStepEnabled, validateCampaign } from '../src/core/campaign';"
          if old not in text:
              raise SystemExit('main campaign import marker missing')
          text = text.replace(old, new, 1)

          old = """function buildAwareDataset(): CampaignDataset {
            const hasBuildActions = Boolean(buildBridge && Object.keys(buildBridge.actionsByStep).length);
            const hasCampaignIntelligence = Object.keys(campaignIntelligence.actionsByStep).length > 0;
            if (!hasBuildActions && !hasCampaignIntelligence) return dataset;
            return {
              ...dataset,
              steps: dataset.steps.map((step) => {"""
          new = """function buildAwareDataset(): CampaignDataset {
            const routeDataset = campaignForRouteMode(dataset, settings.leagueStart);
            const hasBuildActions = Boolean(buildBridge && Object.keys(buildBridge.actionsByStep).length);
            const hasCampaignIntelligence = Object.keys(campaignIntelligence.actionsByStep).length > 0;
            if (!hasBuildActions && !hasCampaignIntelligence) return routeDataset;
            return {
              ...routeDataset,
              steps: routeDataset.steps.map((step) => {"""
          if old not in text:
              raise SystemExit('buildAwareDataset marker missing')
          text = text.replace(old, new, 1)

          old = """function enabled(step: CampaignDataset['steps'][number]): boolean { return isStepEnabled(step, settings); }
          function xpGuidance(level = characterLevel, area = currentAreaLevel) { return calculateXpGuidance(level, area); }
          function runtimeState(): RuntimeState {
            return {
              settings, dataset: buildAwareDataset(), sourceStatus, progress, currentZone: currentZone || undefined, currentAreaId: currentAreaId || undefined, currentAreaLevel, characterLevel,
              xpGuidance: xpGuidance(), rewardProgress: rewardProgressFor(dataset, progress), rewardAudit: buildRewardAudit(dataset, progress, confirmedRewardStepIds),"""
          new = """function enabled(step: CampaignDataset['steps'][number]): boolean { return isStepEnabled(step, settings); }
          function rewardEnabled(step: CampaignDataset['steps'][number]): boolean { return isStepEnabled(step, { ...settings, showOptional: true }); }
          function xpGuidance(level = characterLevel, area = currentAreaLevel) { return calculateXpGuidance(level, area); }
          function runtimeState(): RuntimeState {
            const activeDataset = buildAwareDataset();
            return {
              settings, dataset: activeDataset, sourceStatus, progress, currentZone: currentZone || undefined, currentAreaId: currentAreaId || undefined, currentAreaLevel, characterLevel,
              xpGuidance: xpGuidance(), rewardProgress: rewardProgressFor(activeDataset, progress, rewardEnabled), rewardAudit: buildRewardAudit(activeDataset, progress, confirmedRewardStepIds, rewardEnabled),"""
          if old not in text:
              raise SystemExit('runtimeState marker missing')
          text = text.replace(old, new, 1)

          old = """    rewardProgress: rewardProgressFor(dataset, demoProgress),
              rewardAudit: buildRewardAudit(dataset, demoProgress, new Set()),"""
          new = """    rewardProgress: rewardProgressFor(real.dataset, demoProgress, (candidate) => isStepEnabled(candidate, { ...real.settings, showOptional: true })),
              rewardAudit: buildRewardAudit(real.dataset, demoProgress, new Set(), (candidate) => isStepEnabled(candidate, { ...real.settings, showOptional: true })),"""
          if old not in text:
              raise SystemExit('overlay demo reward marker missing')
          text = text.replace(old, new, 1)
          main.write_text(text, encoding='utf-8')

          guide = Path('src/ui/CampaignGuideV2.tsx')
          text = guide.read_text(encoding='utf-8')
          old = """  const items = progressionTimeline(state.dataset, currentIndex);
            return <div className=\"g2-timeline\">{items.map((item) =>"""
          new = """  const items = progressionTimeline(state.dataset, currentIndex)
              .filter((item) => isStepEnabled(state.dataset.steps[item.stepIndex], state.settings));
            return <div className=\"g2-timeline\">{items.map((item) =>"""
          if old not in text:
              raise SystemExit('timeline marker missing')
          text = text.replace(old, new, 1)
          guide.write_text(text, encoding='utf-8')

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/guide2-one-shot-route-modes.yml
          git add src/core/campaign.ts src/core/rewards.ts electron/main.ts src/ui/CampaignGuideV2.tsx
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Materialize Exile-UI route modes at runtime"
          git push origin HEAD:feature/campaign-guide-2
