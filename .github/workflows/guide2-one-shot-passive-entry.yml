name: Guide 2 one-shot Passive Plan entry

on:
  push:
    branches: [feature/campaign-guide-2]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/campaign-guide-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Wire Overview and Campaign to full Passive Plan
        shell: python
        run: |
          from pathlib import Path

          manager = Path('src/ui/ManagerV2.tsx')
          text = manager.read_text(encoding='utf-8')
          text = text.replace("import CommandPalette, { type AppTab } from './CommandPalette';", "import CommandPalette, { type AppTab } from './CommandPalette';\nimport PassivePlanModal from './PassivePlanModal';", 1)
          old_sig = "function Overview({ state, setState, onNavigate }: { state: RuntimeState; setState: (state: RuntimeState) => void; onNavigate: (tab: AppTab) => void }) {"
          new_sig = "function Overview({ state, setState, onNavigate, onOpenPassive }: { state: RuntimeState; setState: (state: RuntimeState) => void; onNavigate: (tab: AppTab) => void; onOpenPassive: () => void }) {"
          if old_sig not in text:
              raise SystemExit('Overview signature marker not found.')
          text = text.replace(old_sig, new_sig, 1)
          old_button = '<button className="ghost-button" onClick={() => onNavigate(\'guide\')}>View Passive Plan</button>'
          new_button = '<button className="ghost-button" onClick={onOpenPassive}>Open Passive Plan</button>'
          if old_button not in text:
              raise SystemExit('Overview Passive Plan button marker not found.')
          text = text.replace(old_button, new_button, 1)
          old_state = "  const [tab, setTab] = useState<AppTab>('overview');"
          new_state = "  const [tab, setTab] = useState<AppTab>('overview');\n  const [passivePlanOpen, setPassivePlanOpen] = useState(false);"
          if old_state not in text:
              raise SystemExit('Manager state marker not found.')
          text = text.replace(old_state, new_state, 1)
          old_render = "{tab === 'overview' && <Overview state={state} setState={setState} onNavigate={setTab} />}{tab === 'guide' && <CampaignGuideV2 state={state} setState={setState} />}"
          new_render = "{tab === 'overview' && <Overview state={state} setState={setState} onNavigate={setTab} onOpenPassive={() => setPassivePlanOpen(true)} />}{tab === 'guide' && <CampaignGuideV2 state={state} setState={setState} onOpenPassive={() => setPassivePlanOpen(true)} />}"
          if old_render not in text:
              raise SystemExit('Manager tab render marker not found.')
          text = text.replace(old_render, new_render, 1)
          old_tail = "<StartupReconcile state={state} setState={setState} /></div>;"
          new_tail = "<StartupReconcile state={state} setState={setState} />{passivePlanOpen && <PassivePlanModal state={state} onClose={() => setPassivePlanOpen(false)} />}</div>;"
          if old_tail not in text:
              raise SystemExit('Manager tail marker not found.')
          text = text.replace(old_tail, new_tail, 1)
          manager.write_text(text, encoding='utf-8')

          campaign = Path('src/ui/CampaignGuideV2.tsx')
          text = campaign.read_text(encoding='utf-8')
          old_component = "function PassivePlan({ state }: { state: RuntimeState }) {"
          new_component = "function PassivePlan({ state, onOpen }: { state: RuntimeState; onOpen: () => void }) {"
          if old_component not in text:
              raise SystemExit('PassivePlan component marker not found.')
          text = text.replace(old_component, new_component, 1)
          old_section = '<section className={`g2-passive-plan state-${plan.state}`}>\n      <div className="g2-panel-label"><span>PASSIVE PLAN</span><em>No in-game tree overlay</em></div>'
          new_section = '<section className={`g2-passive-plan state-${plan.state}`}>\n      <div className="g2-panel-label"><span>PASSIVE PLAN</span><button className="g2-passive-open" onClick={onOpen}>Open full plan ↗</button></div>'
          if old_section not in text:
              raise SystemExit('PassivePlan section marker not found.')
          text = text.replace(old_section, new_section, 1)
          old_export = "export default function CampaignGuideV2({ state, setState }: { state: RuntimeState; setState: (state: RuntimeState) => void }) {"
          new_export = "export default function CampaignGuideV2({ state, setState, onOpenPassive }: { state: RuntimeState; setState: (state: RuntimeState) => void; onOpenPassive: () => void }) {"
          if old_export not in text:
              raise SystemExit('CampaignGuideV2 signature marker not found.')
          text = text.replace(old_export, new_export, 1)
          old_usage = '<PassivePlan state={state} />'
          new_usage = '<PassivePlan state={state} onOpen={onOpenPassive} />'
          if old_usage not in text:
              raise SystemExit('PassivePlan usage marker not found.')
          text = text.replace(old_usage, new_usage, 1)
          campaign.write_text(text, encoding='utf-8')

          css = Path('src/ui/campaign-guide-v2.css')
          css_text = css.read_text(encoding='utf-8')
          css_text += "\n.g2-passive-open{border:0;background:transparent;color:#c7a462;font-size:9px;font-weight:800;cursor:pointer;padding:0}.g2-passive-open:hover{color:#e2c27e}\n"
          css.write_text(css_text, encoding='utf-8')
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/guide2-one-shot-passive-entry.yml
          git add src/ui/ManagerV2.tsx src/ui/CampaignGuideV2.tsx src/ui/campaign-guide-v2.css
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Open full Passive Plan from Campaign surfaces"
          git push origin HEAD:feature/campaign-guide-2
