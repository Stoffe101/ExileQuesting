name: Sync v0.1.2 once

on:
  push:
    branches: [codex/pre-playtest-simulator-hardening]

permissions:
  contents: write

jobs:
  version:
    if: github.event.head_commit.message != 'Bump ExileQuesting to v0.1.2 [bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pre-playtest-simulator-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Synchronize package and lockfile versions
        run: npm version 0.1.2 --no-git-tag-version --allow-same-version
      - name: Verify synchronized versions
        run: |
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!=='0.1.2'||l.version!=='0.1.2'||l.packages[''].version!=='0.1.2') process.exit(1)"
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Bump ExileQuesting to v0.1.2 [bot]"
          git push origin HEAD:codex/pre-playtest-simulator-hardening
