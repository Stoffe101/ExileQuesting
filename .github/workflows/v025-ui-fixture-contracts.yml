name: v0.2.5 UI fixture contracts

on:
  push:
    branches: [feature/campaign-guide-2]
    paths:
      - tools/apply-v025-ui-fixture-contracts.mjs
      - .github/workflows/v025-ui-fixture-contracts.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/campaign-guide-2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node --check tools/apply-v025-ui-fixture-contracts.mjs
      - run: node tools/apply-v025-ui-fixture-contracts.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run visual:gear
      - run: npm run visual:doctor
      - run: npm run smoke:lab
      - name: Remove one-shot patch files
        shell: pwsh
        run: |
          Remove-Item tools/apply-v025-ui-fixture-contracts.mjs -Force
          Remove-Item .github/workflows/v025-ui-fixture-contracts.yml -Force
      - name: Commit validated UI fixture contract hardening
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/visual-gear-coach.ts tools/visual-build-doctor.ts tools/smoke-lab.ts tsconfig.json tools/apply-v025-ui-fixture-contracts.mjs .github/workflows/v025-ui-fixture-contracts.yml
          git commit -m "Harden UI fixtures against RuntimeState drift"
          git push origin HEAD:feature/campaign-guide-2
