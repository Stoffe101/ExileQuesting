name: v0.2 live-level integration

on:
  push:
    branches: [feature/v0.2-player-coach]
    paths:
      - tools/patch-v020-live-level-temp.mjs
      - .github/workflows/v020-live-level-patch-temp.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.2-player-coach
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node tools/patch-v020-live-level-temp.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Commit runtime live-level wiring
        run: |
          git config user.name "Skrra"
          git config user.email "94893570+Stoffe101@users.noreply.github.com"
          git add electron/main.ts
          git diff --cached --quiet && exit 0
          git commit -m "Use live character level in build gear hints"
          git push origin HEAD:feature/v0.2-player-coach
