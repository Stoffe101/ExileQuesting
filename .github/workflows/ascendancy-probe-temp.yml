name: Ascendancy geometry probe temp

on:
  push:
    branches:
      - feature/passive-tree-hud
    paths:
      - .github/workflows/ascendancy-probe-temp.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect live GGG Ascendancy geometry
        shell: bash
        run: |
          node <<'NODE'
          const response = await fetch('https://www.pathofexile.com/passive-skill-tree', {
            headers: { 'User-Agent': 'ExileQuesting ascendancy geometry probe (github.com/Stoffe101/ExileQuesting)' },
            signal: AbortSignal.timeout(30000),
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const html = await response.text();
          const marker = 'var passiveSkillTreeData';
          const markerIndex = html.indexOf(marker);
          const start = html.indexOf('{', markerIndex + marker.length);
          let depth = 0, inString = false, escaped = false, end = -1;
          for (let i = start; i < html.length; i++) {
            const ch = html[i];
            if (inString) {
              if (escaped) escaped = false;
              else if (ch === '\\') escaped = true;
              else if (ch === '"') inString = false;
              continue;
            }
            if (ch === '"') { inString = true; continue; }
            if (ch === '{') depth++;
            else if (ch === '}' && --depth === 0) { end = i + 1; break; }
          }
          const tree = JSON.parse(html.slice(start, end));
          const nodes = Object.values(tree.nodes);
          const asc = nodes.filter(n => n && typeof n.ascendancyName === 'string');
          const byName = new Map();
          for (const node of asc) {
            const name = node.ascendancyName;
            const bucket = byName.get(name) ?? { total:0, starts:0, withPlacement:0, groups:new Set(), ids:[] };
            bucket.total++;
            if (node.isAscendancyStart) bucket.starts++;
            if (Number.isInteger(Number(node.group)) && Number.isInteger(Number(node.orbit)) && Number.isInteger(Number(node.orbitIndex))) bucket.withPlacement++;
            if (node.group !== undefined) bucket.groups.add(String(node.group));
            if (bucket.ids.length < 3) bucket.ids.push([node.skill, node.name, node.group, node.orbit, node.orbitIndex, Boolean(node.isAscendancyStart)]);
            byName.set(name, bucket);
          }
          console.log(`Ascendancy names: ${byName.size}; nodes: ${asc.length}`);
          for (const [name, b] of [...byName].sort((a,b)=>a[0].localeCompare(b[0]))) {
            console.log(JSON.stringify({ name, total:b.total, starts:b.starts, withPlacement:b.withPlacement, groups:b.groups.size, sample:b.ids }));
          }
          const missing = asc.filter(n => !(Number.isInteger(Number(n.group)) && Number.isInteger(Number(n.orbit)) && Number.isInteger(Number(n.orbitIndex))));
          console.log(`Missing placement: ${missing.length}`);
          if (missing.length) console.log(JSON.stringify(missing.slice(0,20).map(n => ({ id:n.skill, name:n.name, asc:n.ascendancyName, group:n.group, orbit:n.orbit, orbitIndex:n.orbitIndex, start:Boolean(n.isAscendancyStart) }))));
          NODE
