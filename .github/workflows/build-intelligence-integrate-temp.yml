name: Integrate build intelligence

on:
  push:
    branches: [codex/build-aware-campaign-intelligence]
    paths:
      - tools/apply-build-intelligence.mjs
      - tools/run-build-intelligence-integration.mjs
      - .github/workflows/build-intelligence-integrate-temp.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/build-aware-campaign-intelligence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply runtime and UI integration
        run: node tools/run-build-intelligence-integration.mjs
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:gems
      - run: npm run audit:campaign
      - run: npm run lint:campaign
      - run: npm run simulate:campaign
      - run: npm run build
      - name: Commit gated integration
        shell: bash
        run: |
          git add electron/main.ts electron/preload.ts src/core/types.ts src/ui/App.tsx src/ui/BuildWorkspace.tsx src/ui/styles.css
          if git diff --cached --quiet; then
            echo "Build intelligence integration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Wire build-aware campaign intelligence into runtime"
          git pull --rebase origin codex/build-aware-campaign-intelligence
          git push origin HEAD:codex/build-aware-campaign-intelligence
