name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm audit --omit=dev; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "npm audit failed on attempt $attempt; retrying after a short delay."
            sleep $((attempt * 10))
          done
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:gems
      - run: npm run validate:passives
      - run: npm run validate:manifest
      - run: npm run audit:campaign
      - run: npm run lint:campaign
      - run: npm run simulate:campaign
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ExileQuesting-preplaytest-${{ github.sha }}
          path: artifacts/simulation/*
          if-no-files-found: warn
          retention-days: 30
      - run: npm run build
