name: v0.2.5 final guarded PoB pruning

on:
  push:
    branches: [feature/campaign-guide-2]
    paths: [.github/workflows/v025-final-pob-prune-v3.yml]

permissions:
  contents: write

jobs:
  prune-and-prove:
    runs-on: windows-2025
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/campaign-guide-2
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply fully guarded PoB pruning patch
        shell: pwsh
        run: |
          $workflow = Get-Content .github/workflows/v025-final-pob-prune.yml -Raw
          $match = [regex]::Match($workflow, "(?s)          @'\r?\n(.*?)\r?\n          '@ \| Set-Content -Encoding utf8 \.tmp-patch\.py")
          if (-not $match.Success) { throw 'Could not extract guarded pruning patch.' }
          $script = [regex]::Replace($match.Groups[1].Value, '(?m)^          ', '')
          Set-Content -Encoding utf8 .tmp-patch.py $script
          python .tmp-patch.py
          Remove-Item .tmp-patch.py

          @'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected v3 patch anchor missing in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace('electron/services/pob-runtime.test.ts',
          "  POB_KERNEL_REPOSITORY,\n  pobConstraintRuntimeOptions,",
          "  POB_KERNEL_REPOSITORY,\n  POB_KERNEL_SUPPORTED_TREE_VERSIONS,\n  pobConstraintRuntimeOptions,")
          replace('electron/services/pob-runtime.test.ts',
          "    constraintAdapterVersion: 'constraint-0.1.0',\n    fileCount: treeEntries.length,",
          "    constraintAdapterVersion: 'constraint-0.1.0',\n    supportedTreeVersions: [...POB_KERNEL_SUPPORTED_TREE_VERSIONS],\n    fileCount: treeEntries.length,")

          replace('tools/smoke-pob-runtime.ts',
          "import { runPobKernelRequest } from '../electron/services/pob-kernel-service';",
          "import { PobKernelWorkerError, runPobKernelRequest } from '../electron/services/pob-kernel-service';")
          old = '''  const legacyXml = smokeXml.replace('treeVersion=\\"3_29\\"', 'treeVersion=\\"3_28\\"');
  const legacyResponse = await runPobKernelRequest({
    protocolVersion: POB_CALCULATION_PROTOCOL_VERSION,
    requestId: `packaged-legacy-tree-${process.pid}`,
    operation: 'load-and-calculate',
    xml: legacyXml,
    scenario: { scenario: 'imported', label: 'Unsupported-tree contract smoke' },
  }, pobKernelRuntimeOptions(bundle));
  if (legacyResponse.ok || !('error' in legacyResponse) || legacyResponse.error.code !== 'unsupported-tree-version') throw new Error('Embedded PoB kernel did not reject an unsupported historical tree version cleanly.');
'''
          new = '''  const legacyXml = smokeXml.replace('treeVersion=\\"3_29\\"', 'treeVersion=\\"3_28\\"');
  let unsupportedTreeRejected = false;
  try {
    await runPobKernelRequest({
      protocolVersion: POB_CALCULATION_PROTOCOL_VERSION,
      requestId: `packaged-legacy-tree-${process.pid}`,
      operation: 'load-and-calculate',
      xml: legacyXml,
      scenario: { scenario: 'imported', label: 'Unsupported-tree contract smoke' },
    }, pobKernelRuntimeOptions(bundle));
  } catch (error) {
    unsupportedTreeRejected = error instanceof PobKernelWorkerError
      && error.code === 'unsupported-tree-version'
      && /standard PoE 3\\.29 passive trees only/i.test(error.message);
  }
  if (!unsupportedTreeRejected) throw new Error('Embedded PoB kernel did not reject an unsupported historical tree version cleanly.');
'''
          replace('tools/smoke-pob-runtime.ts', old, new)
          replace('tools/smoke-pob-runtime.ts',
          "  console.log(`PoB real calculation PASS: life=${result.defence.life}, DPS=${result.offence.totalDps ?? 'n/a'}.`);",
          "  console.log(`PoB real calculation PASS: life=${result.defence.life}, DPS=${result.offence.totalDps ?? 'n/a'}.`);\n  console.log('PoB unsupported-tree contract PASS: historical tree rejected with conversion guidance.');")

          for workflow in [
              '.github/workflows/v025-profile-pob-bundle.yml',
              '.github/workflows/v025-final-pob-prune.yml',
              '.github/workflows/v025-final-pob-prune-v2.yml',
              '.github/workflows/v025-final-pob-prune-v3.yml']:
              p = Path(workflow)
              if p.exists(): p.unlink()
          '@ | Set-Content -Encoding utf8 .tmp-v3.py
          python .tmp-v3.py
          Remove-Item .tmp-v3.py
      - run: npm run typecheck
      - run: npm test
      - name: Build, stage and prove pinned headless PoB runtime
        run: npm run prepare:pob-runtime:win
      - name: Re-run staged PoB proof explicitly
        run: npm run smoke:pob-runtime
      - name: Commit only fully validated source
        shell: pwsh
        run: |
          git config user.name "Skrra"
          git config user.email "94893570+Stoffe101@users.noreply.github.com"
          git add electron/services/pob-runtime.ts electron/services/pob-runtime.test.ts tools/stage-pob-runtime.ts tools/smoke-pob-runtime.ts tools/pob-kernel/worker.lua tools/pob-kernel/constraint-worker.lua .github/workflows
          git diff --cached --check
          git commit -m "Slim pinned PoB runtime for v0.2.5 playtest"
          git push origin HEAD:feature/campaign-guide-2
