name: Apply post-merge hardening once

on:
  push:
    branches: [codex/v0.1.2-postmerge-hardening]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Harden Windows persistence and packaging [bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0.1.2-postmerge-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply deterministic source fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          // 1) Serialize writes per state file and use collision-proof temp names.
          {
            const file = 'electron/services/state-store.ts';
            let text = fs.readFileSync(file, 'utf8');
            text = text.replace("import { promises as fs } from 'node:fs';\n", "import { promises as fs } from 'node:fs';\nimport { randomUUID } from 'node:crypto';\n");
            text = text.replace(
              "export class StateStore {\n  constructor(private root: string) {}",
              "export class StateStore {\n  private writeQueues = new Map<string, Promise<void>>();\n\n  constructor(private root: string) {}"
            );
            const oldWrite = `  async write(name: string, value: unknown): Promise<void> {\n    const target = this.path(name);\n    await fs.mkdir(path.dirname(target), { recursive: true });\n    const temporary = \`${'${target}.${process.pid}.${Date.now()}.tmp'}\`;\n    await fs.writeFile(temporary, JSON.stringify(value, null, 2), 'utf8');\n    await fs.rename(temporary, target);\n  }`;
            const newWrite = `  async write(name: string, value: unknown): Promise<void> {\n    const previous = this.writeQueues.get(name) ?? Promise.resolve();\n    const operation = previous.catch(() => undefined).then(async () => {\n      const target = this.path(name);\n      await fs.mkdir(path.dirname(target), { recursive: true });\n      const temporary = \`${'${target}.${process.pid}.${randomUUID()}.tmp'}\`;\n      await fs.writeFile(temporary, JSON.stringify(value, null, 2), 'utf8');\n      try {\n        let lastError: unknown;\n        for (let attempt = 0; attempt < 5; attempt += 1) {\n          try {\n            await fs.rename(temporary, target);\n            return;\n          } catch (error) {\n            lastError = error;\n            const code = error && typeof error === 'object' && 'code' in error ? String((error as { code?: unknown }).code) : '';\n            if (!['EPERM', 'EBUSY', 'EACCES'].includes(code) || attempt === 4) throw error;\n            await new Promise((resolve) => setTimeout(resolve, 10 * (attempt + 1)));\n          }\n        }\n        throw lastError;\n      } finally {\n        await fs.rm(temporary, { force: true }).catch(() => undefined);\n      }\n    });\n    this.writeQueues.set(name, operation);\n    try {\n      await operation;\n    } finally {\n      if (this.writeQueues.get(name) === operation) this.writeQueues.delete(name);\n    }\n  }`;
            if (!text.includes(oldWrite)) throw new Error('StateStore write block did not match expected source.');
            text = text.replace(oldWrite, newWrite);
            fs.writeFileSync(file, text);
          }

          // 2) Add a regression that forces many same-file writes concurrently.
          {
            const file = 'electron/services/state-store.test.ts';
            let text = fs.readFileSync(file, 'utf8');
            text = text.replace(
              "import { mkdtemp, rm, writeFile } from 'node:fs/promises';",
              "import { mkdtemp, readFile, readdir, rm, writeFile } from 'node:fs/promises';"
            );
            const marker = "  it('recovers safely from malformed build-profile state', async () => {";
            const test = `  it('serializes concurrent writes to the same state file without temp collisions', async () => {\n    const { state, directory } = await store();\n    await Promise.all(Array.from({ length: 64 }, (_, index) => state.write('concurrent.json', { index })));\n    const saved = JSON.parse(await readFile(path.join(directory, 'concurrent.json'), 'utf8')) as { index: number };\n    expect(saved.index).toBe(63);\n    const leftovers = (await readdir(directory)).filter((name) => name.includes('concurrent.json.') && name.endsWith('.tmp'));\n    expect(leftovers).toEqual([]);\n  });\n\n`;
            if (!text.includes(marker)) throw new Error('StateStore test insertion marker missing.');
            text = text.replace(marker, test + marker);
            fs.writeFileSync(file, text);
          }

          // 3) Make late content-size IPC harmless and keep visual/soak modes read-only.
          {
            const file = 'electron/main.ts';
            let text = fs.readFileSync(file, 'utf8');
            const oldHandler = `  ipcMain.handle('overlay:content-size', async (_event, height: number) => {\n    if (!overlayWindow || !Number.isFinite(height)) return;\n    markProgrammaticOverlayMove(); settings.overlayPosition = resizeOverlayToContent(overlayWindow, height, settings); await saveSettings();\n  });`;
            const newHandler = `  ipcMain.handle('overlay:content-size', async (_event, height: number) => {\n    const targetWindow = overlayWindow;\n    if (!targetWindow || targetWindow.isDestroyed() || !Number.isFinite(height)) return;\n    try {\n      markProgrammaticOverlayMove();\n      settings.overlayPosition = resizeOverlayToContent(targetWindow, height, settings);\n      if (!visualSmokeArgument && !overlaySoakArgument) await saveSettings();\n    } catch (error) {\n      if (targetWindow.isDestroyed()) return;\n      throw error;\n    }\n  });`;
            if (!text.includes(oldHandler)) throw new Error('overlay:content-size block did not match expected source.');
            text = text.replace(oldHandler, newHandler);
            fs.writeFileSync(file, text);
          }

          // 4) Normal CI packaging must never trigger electron-builder publishing implicitly.
          {
            const file = 'package.json';
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            pkg.scripts.dist = 'npm run build && electron-builder --win nsis --publish never';
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          }
          NODE
      - name: Verify hotfix
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run lint:campaign
          npm run simulate:campaign
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/main.ts electron/services/state-store.ts electron/services/state-store.test.ts package.json
          git commit -m "Harden Windows persistence and packaging [bot]"
          git push origin HEAD:codex/v0.1.2-postmerge-hardening
