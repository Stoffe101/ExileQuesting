name: v0.2.5 guarded PoB runtime pruning

on:
  push:
    branches: [feature/campaign-guide-2]
    paths: [.github/workflows/v025-final-pob-prune.yml]

permissions:
  contents: write

jobs:
  prune-and-prove:
    runs-on: windows-2025
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/campaign-guide-2
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch current-tree PoB kernel contract
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected patch anchor missing in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace('electron/services/pob-runtime.ts',
          "export const POB_KERNEL_BUNDLE_SCHEMA_VERSION = 1;\nexport const POB_KERNEL_REPOSITORY = 'PathOfBuildingCommunity/PathOfBuilding';",
          "export const POB_KERNEL_BUNDLE_SCHEMA_VERSION = 2;\nexport const POB_KERNEL_SUPPORTED_TREE_VERSIONS = ['3_29'] as const;\nexport const POB_KERNEL_REPOSITORY = 'PathOfBuildingCommunity/PathOfBuilding';")

          replace('electron/services/pob-runtime.ts',
          "  headlessWrapper: 'pob/src/HeadlessWrapper.lua',\n  worker: 'worker.lua',",
          "  headlessWrapper: 'pob/src/HeadlessWrapper.lua',\n  currentTree: 'pob/src/TreeData/3_29/tree.lua',\n  treeAssetFallback: 'pob/src/TreeData/3_19/Assets.lua',\n  timelessLegionPassives: 'pob/src/Data/TimelessJewelData/LegionPassives.lua',\n  worker: 'worker.lua',")

          replace('electron/services/pob-runtime.ts',
          "  constraintAdapterVersion: string;\n  fileCount: number;",
          "  constraintAdapterVersion: string;\n  supportedTreeVersions: string[];\n  fileCount: number;")

          replace('electron/services/pob-runtime.ts',
          "  if (!manifest.constraintAdapterVersion?.trim() || manifest.constraintAdapterVersion.length > 32) throw new Error('PoB kernel bundle constraint adapter version is missing or invalid.');\n  if (!Number.isSafeInteger(manifest.fileCount)",
          "  if (!manifest.constraintAdapterVersion?.trim() || manifest.constraintAdapterVersion.length > 32) throw new Error('PoB kernel bundle constraint adapter version is missing or invalid.');\n  if (!Array.isArray(manifest.supportedTreeVersions) || manifest.supportedTreeVersions.length !== POB_KERNEL_SUPPORTED_TREE_VERSIONS.length || manifest.supportedTreeVersions.some((version, index) => version !== POB_KERNEL_SUPPORTED_TREE_VERSIONS[index])) {\n    throw new Error(`PoB kernel bundle tree-version contract is invalid; expected ${POB_KERNEL_SUPPORTED_TREE_VERSIONS.join(', ')}.`);\n  }\n  if (!Number.isSafeInteger(manifest.fileCount)")

          replace('tools/stage-pob-runtime.ts',
          "  POB_KERNEL_REPOSITORY,\n  type PobKernelBundleManifest,",
          "  POB_KERNEL_REPOSITORY,\n  POB_KERNEL_SUPPORTED_TREE_VERSIONS,\n  type PobKernelBundleManifest,")

          replace('tools/stage-pob-runtime.ts',
          "const HEAVY_ASSET_EXTENSIONS = new Set(['.png', '.jpg', '.jpeg', '.webp', '.bmp', '.gif', '.svg', '.ttf', '.otf']);",
          "const HEAVY_ASSET_EXTENSIONS = new Set(['.png', '.jpg', '.jpeg', '.webp', '.bmp', '.gif', '.svg', '.ttf', '.otf']);\nconst REQUIRED_TREE_SUPPORT_FILES = new Set(['TreeData/3_19/Assets.lua']);")

          replace('tools/stage-pob-runtime.ts',
          "    if (relative === 'Assets' || relative.startsWith('Assets/')) return false;\n    return !HEAVY_ASSET_EXTENSIONS.has(path.extname(candidate).toLowerCase());",
          "    if (relative === 'Assets' || relative.startsWith('Assets/')) return false;\n    if (relative === 'TreeData') return true;\n    if (relative.startsWith('TreeData/')) {\n      if (relative === 'TreeData/3_29' || relative.startsWith('TreeData/3_29/')) return !HEAVY_ASSET_EXTENSIONS.has(path.extname(candidate).toLowerCase());\n      if (relative === 'TreeData/legion' || relative.startsWith('TreeData/legion/')) return !HEAVY_ASSET_EXTENSIONS.has(path.extname(candidate).toLowerCase());\n      if (relative === 'TreeData/3_19') return true;\n      return REQUIRED_TREE_SUPPORT_FILES.has(relative);\n    }\n    return !HEAVY_ASSET_EXTENSIONS.has(path.extname(candidate).toLowerCase());")

          replace('tools/stage-pob-runtime.ts',
          "  await cp(path.join(args.pobRoot, 'spec', 'TestBuilds', '3.13', 'OccVortex.xml'), path.join(args.output, 'smoke', 'OccVortex.xml'), { force: true });",
          "  const legacySmoke = await readFile(path.join(args.pobRoot, 'spec', 'TestBuilds', '3.13', 'OccVortex.xml'), 'utf8');\n  const currentSmoke = legacySmoke\n    .replace('ascendClassName=\\\"Occultist\\\"', 'ascendClassName=\\\"None\\\"')\n    .replace(/<Tree activeSpec=\\\"1\\\">[\\s\\S]*?<\\/Tree>/, '<Tree activeSpec=\\\"1\\\">\\n\\t\\t<Spec title=\\\"ExileQuesting 3.29 smoke\\\" treeVersion=\\\"3_29\\\" classId=\\\"3\\\" ascendClassId=\\\"0\\\" secondaryAscendClassId=\\\"0\\\" nodes=\\\"\\\" masteryEffects=\\\"\\\"/>\\n\\t</Tree>');\n  if (currentSmoke === legacySmoke || !currentSmoke.includes('treeVersion=\\\"3_29\\\"')) throw new Error('Could not materialize the current-tree PoB smoke fixture.');\n  await writeFile(path.join(args.output, 'smoke', 'OccVortex.xml'), currentSmoke, 'utf8');")

          replace('tools/stage-pob-runtime.ts',
          "  const manifest: PobKernelBundleManifest = { schemaVersion: POB_KERNEL_BUNDLE_SCHEMA_VERSION, generatedAt: new Date().toISOString(), pobRepository: POB_KERNEL_REPOSITORY, pobCommit: actualPobCommit, luaJitRepository: POB_KERNEL_LUAJIT_REPOSITORY, luaJitCommit: actualLuaJitCommit, workerAdapterVersion: adapterVersion(workerText, 'PoB worker'), constraintAdapterVersion: adapterVersion(constraintWorkerText, 'PoB constraint worker'), ...aggregate, criticalFiles: await criticalFileMetadata(args.output) };",
          "  const manifest: PobKernelBundleManifest = { schemaVersion: POB_KERNEL_BUNDLE_SCHEMA_VERSION, generatedAt: new Date().toISOString(), pobRepository: POB_KERNEL_REPOSITORY, pobCommit: actualPobCommit, luaJitRepository: POB_KERNEL_LUAJIT_REPOSITORY, luaJitCommit: actualLuaJitCommit, workerAdapterVersion: adapterVersion(workerText, 'PoB worker'), constraintAdapterVersion: adapterVersion(constraintWorkerText, 'PoB constraint worker'), supportedTreeVersions: [...POB_KERNEL_SUPPORTED_TREE_VERSIONS], ...aggregate, criticalFiles: await criticalFileMetadata(args.output) };")

          replace('tools/stage-pob-runtime.ts',
          "  console.log(`Removed PoB GUI imagery/runtime; bundle budget ${MAX_HEADLESS_BUNDLE_BYTES} bytes.`);",
          "  console.log(`Supported passive-tree versions: ${POB_KERNEL_SUPPORTED_TREE_VERSIONS.join(', ')}.`);\n  console.log(`Removed historical passive trees and PoB GUI imagery/runtime; bundle budget ${MAX_HEADLESS_BUNDLE_BYTES} bytes.`);")

          for worker, old_version, new_version in [
              ('tools/pob-kernel/worker.lua', 'local ADAPTER_VERSION = \"0.6.0\"', 'local ADAPTER_VERSION = \"0.7.0\"'),
              ('tools/pob-kernel/constraint-worker.lua', 'local ADAPTER_VERSION = \"constraint-0.1.0\"', 'local ADAPTER_VERSION = \"constraint-0.2.0\"')]:
              replace(worker, old_version, new_version)
              marker = 'local MAX_ITEM_TEXT_BYTES = 128 * 1024\n'
              helper = marker + '''local SUPPORTED_TREE_VERSIONS = { ["3_29"] = true }\n\nlocal function unsupportedTreeVersion(xml)\n    for treeVersion in xml:gmatch('treeVersion%s*=%s*"([^"]+)"') do\n        if not SUPPORTED_TREE_VERSIONS[treeVersion] then\n            return treeVersion\n        end\n    end\n    return nil\nend\n'''
              replace(worker, marker, helper)

          replace('tools/pob-kernel/worker.lua',
          "    if type(request.xml) ~= \"string\" or request.xml == \"\" or #request.xml > 16 * 1024 * 1024 then\n        return false, errorResponse(request.requestId, \"xml-bounds\", \"PoB XML must be non-empty and no larger than 16 MiB.\", false)\n    end\n\n    local ok, err = pcall(loadBuildFromXML, request.xml, \"ExileQuesting worker\")",
          "    if type(request.xml) ~= \"string\" or request.xml == \"\" or #request.xml > 16 * 1024 * 1024 then\n        return false, errorResponse(request.requestId, \"xml-bounds\", \"PoB XML must be non-empty and no larger than 16 MiB.\", false)\n    end\n    local unsupported = unsupportedTreeVersion(request.xml)\n    if unsupported then\n        return false, errorResponse(request.requestId, \"unsupported-tree-version\", \"Embedded Build Doctor calculations support standard PoE 3.29 passive trees only; this build contains tree version \" .. unsupported .. \". Open and re-save/convert it in current Path of Building before analysis.\", false)\n    end\n\n    local ok, err = pcall(loadBuildFromXML, request.xml, \"ExileQuesting worker\")")

          replace('tools/pob-kernel/constraint-worker.lua',
          "    if type(request.xml) ~= \"string\" or request.xml == \"\" or #request.xml > 16 * 1024 * 1024 then\n        return false, \"xml-bounds\", \"PoB XML must be non-empty and no larger than 16 MiB.\"\n    end\n    if type(request.slot)",
          "    if type(request.xml) ~= \"string\" or request.xml == \"\" or #request.xml > 16 * 1024 * 1024 then\n        return false, \"xml-bounds\", \"PoB XML must be non-empty and no larger than 16 MiB.\"\n    end\n    local unsupported = unsupportedTreeVersion(request.xml)\n    if unsupported then\n        return false, \"unsupported-tree-version\", \"Embedded Build Doctor calculations support standard PoE 3.29 passive trees only; this build contains tree version \" .. unsupported .. \". Open and re-save/convert it in current Path of Building before analysis.\"\n    end\n    if type(request.slot)")

          replace('tools/smoke-pob-runtime.ts',
          "  POB_KERNEL_LUAJIT_COMMIT,\n  pobConstraintRuntimeOptions,",
          "  POB_KERNEL_LUAJIT_COMMIT,\n  POB_KERNEL_SUPPORTED_TREE_VERSIONS,\n  pobConstraintRuntimeOptions,")

          replace('tools/smoke-pob-runtime.ts',
          "  const bundle = await validatePobKernelBundle(root);\n\n  const requestId",
          "  const bundle = await validatePobKernelBundle(root);\n  if (bundle.manifest.supportedTreeVersions.join(',') !== POB_KERNEL_SUPPORTED_TREE_VERSIONS.join(',')) throw new Error('Packaged PoB tree-version contract mismatch.');\n\n  const requestId")

          replace('tools/smoke-pob-runtime.ts',
          "  if (!Number.isFinite(result.defence.life) || (result.defence.life ?? 0) <= 0) throw new Error('Headless PoB calculation smoke returned no valid life value.');\n\n  console.log(`PoB runtime health PASS:",
          "  if (!Number.isFinite(result.defence.life) || (result.defence.life ?? 0) <= 0) throw new Error('Headless PoB calculation smoke returned no valid life value.');\n\n  const legacyXml = smokeXml.replace('treeVersion=\\\"3_29\\\"', 'treeVersion=\\\"3_28\\\"');\n  const legacyResponse = await runPobKernelRequest({\n    protocolVersion: POB_CALCULATION_PROTOCOL_VERSION,\n    requestId: `packaged-legacy-tree-${process.pid}`,\n    operation: 'load-and-calculate',\n    xml: legacyXml,\n    scenario: { scenario: 'imported', label: 'Unsupported-tree contract smoke' },\n  }, pobKernelRuntimeOptions(bundle));\n  if (legacyResponse.ok || !('error' in legacyResponse) || legacyResponse.error.code !== 'unsupported-tree-version') throw new Error('Embedded PoB kernel did not reject an unsupported historical tree version cleanly.');\n\n  console.log(`PoB runtime health PASS:")

          p = Path('.github/workflows/v025-profile-pob-bundle.yml')
          if p.exists(): p.unlink()
          Path('.github/workflows/v025-final-pob-prune.yml').unlink()
          '@ | Set-Content -Encoding utf8 .tmp-patch.py
          python .tmp-patch.py
          Remove-Item .tmp-patch.py
      - run: npm run typecheck
      - run: npm test
      - name: Build and stage pinned headless PoB runtime
        run: npm run prepare:pob-runtime:win
      - name: Prove staged PoB runtime and compatibility contract
        run: npm run smoke:pob-runtime
      - name: Commit validated pruning
        shell: pwsh
        run: |
          git config user.name "Skrra"
          git config user.email "94893570+Stoffe101@users.noreply.github.com"
          git add electron/services/pob-runtime.ts tools/stage-pob-runtime.ts tools/smoke-pob-runtime.ts tools/pob-kernel/worker.lua tools/pob-kernel/constraint-worker.lua .github/workflows
          git diff --cached --check
          git commit -m "Slim pinned PoB runtime for v0.2.5 playtest"
          git push origin HEAD:feature/campaign-guide-2
